<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2faf6">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="movai-icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="movai-icon-512.png">
<link rel="apple-touch-icon" href="movai-icon-192.png">
<title>MovAi Music Generate Kh — AI Chat</title>
<script>try{var _mt=localStorage.getItem("movai-theme")||"auto";var _md=_mt==="auto"?window.matchMedia("(prefers-color-scheme: dark)").matches:_mt==="night";document.documentElement.setAttribute("data-theme",_md?"dark":"light");}catch(e){document.documentElement.setAttribute("data-theme","light")}</script>
<style>
  /* MovAi new — KIE.AI clean look, one single pale background, no layers. */
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;overflow-x:hidden}
  html{
    background:linear-gradient(180deg,#e8f5f0 0%,#f2faf6 45%,#ffffff 100%);
    background-attachment:fixed;
    -webkit-text-size-adjust:100%;
  }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    color:#1f2937;
    background:linear-gradient(180deg,#e8f5f0 0%,#f2faf6 45%,#ffffff 100%);
    background-attachment:fixed;
    min-height:100vh;
  }
  a{color:#1f2937;text-decoration:none}
  button{font:inherit;color:inherit;background:transparent;border:0;padding:0;cursor:pointer}
  img{display:block;max-width:100%}

  .wrap{max-width:720px;margin:0 auto}

  /* ---- Header: two rows, directly on the background (transparent) ---- */
  header{position:fixed;top:0;left:0;right:0;z-index:50;max-width:720px;margin-left:auto;margin-right:auto;
    background:linear-gradient(180deg,#e8f5f0 0%,#f2faf6 45%,#ffffff 100%);
    background-attachment:fixed;}
  .hdr-row{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding-left:16px;padding-right:16px}
  .hdr-top{padding-top:14px;padding-bottom:10px;border-bottom:1px solid #e5e7eb}
  .hdr-sub{padding-top:11px;padding-bottom:11px;border-bottom:1px solid #e5e7eb}
  .hdr-logo{display:flex;align-items:center;gap:8px;color:#1f2937;min-width:0}
  .hdr-logo svg,.hdr-logo img{flex:none}
  .hdr-logo b{font-size:1.3rem;font-weight:800;letter-spacing:-.02em;color:#1f2937;line-height:1}
  .hdr-sec{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
  .hdr-sec-name{font-size:1rem;font-weight:600;color:#1f2937;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hdr-btn{flex:none;font-size:.9rem;font-weight:600;color:#1f2937;
    border:1px solid #d1d5db;border-radius:8px;padding:6px 12px;background:transparent}
  .hdr-btn:active{background:#e5e7eb}

  /* ---- Bottom menu: fixed bottom-left button, bottom sheet (never rises to the top) ---- */
  .menu-fab{position:fixed;left:16px;bottom:16px;z-index:60;
    width:52px;height:52px;border-radius:50%;
    background:#f2faf6;border:1px solid #d1d5db;
    font-size:1.4rem;line-height:1;color:#1f2937;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 10px rgba(0,0,0,.12);transition:opacity .25s ease}
  .menu-fab:active{background:#e5e7eb}
  .menu-veil{position:fixed;inset:0;z-index:55;display:none;
    background:rgba(242,250,246,.55);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
  .menu-veil.open{display:block;animation:veilIn .18s ease-out}
  @keyframes veilIn{from{opacity:0}to{opacity:1}}
  .menu{position:fixed;left:0;right:0;bottom:0;z-index:56;
    max-height:70vh;overflow-y:auto;
    background:#f2faf6;border-top:1px solid #e5e7eb;border-radius:16px 16px 0 0;
    padding:6px 0 calc(10px + env(safe-area-inset-bottom,0px));
    transform:translateY(105%);transition:transform .22s ease-out;
    visibility:hidden}
  .menu.open{transform:translateY(0);visibility:visible;animation:sheetIn .25s ease-out}
  @keyframes sheetIn{from{filter:blur(6px)}to{filter:blur(0)}}
  .menu.open + .menu-fab{display:none}
  .menu a,.menu button.menu-link{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    padding:13px 20px;font-size:.95rem;color:#1f2937;border-bottom:1px solid #eef1f0;background:transparent}
  .menu a .nav-ic{display:inline-flex;flex:none;line-height:0}
  .menu a .nav-ic svg{display:block;width:20px;height:20px}
  .menu a:last-child,.menu button.menu-link:last-child{border-bottom:0}
  .menu a:active,.menu button.menu-link:active{background:#e5e7eb}
  .menu a.split-locked{opacity:.65}
  .menu a.split-locked::after{content:" \1F512"}
  .menu a .new-badge{margin-left:auto;flex:none;font-size:.62rem;font-weight:800;letter-spacing:.02em;color:#fff;background:linear-gradient(90deg,#ff2d78,#ff7a18);border-radius:999px;padding:2px 7px;line-height:1.4}
  .menu .menu-sep{height:1px;background:#e5e7eb;margin:6px 0}
  .menu .menu-user{padding:12px 20px 4px;font-size:.85rem;color:#6b7280}
  [hidden]{display:none !important}

  /* ---- Chat button: bottom-right, slides in from the right edge ---- */
  .chat-fab{position:fixed;right:16px;bottom:16px;z-index:60;
    width:52px;height:52px;border-radius:50%;
    background:#0f766e;border:1px solid #0f766e;
    color:#ffffff;display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 10px rgba(0,0,0,.18);
    transform:translateX(calc(100% + 24px));opacity:0;filter:blur(6px);
    transition:transform .45s ease-out,opacity .45s ease-out,filter .45s ease-out;
    pointer-events:none}
  .chat-fab.in{transform:translateX(0);opacity:1;filter:blur(0);pointer-events:auto}
  .chat-fab.out{transform:translateX(calc(100% + 24px));opacity:0;filter:blur(6px);pointer-events:none}
  .chat-fab:active{opacity:.85}
  /* Round 4 (G): hide the chat button while the drawer is open, same as
     the menu button (which the drawer already hides). The 10s slide-away
     timer is untouched - this only covers the button while the drawer is
     open, and it returns to whatever state the timer left it in. */
  body.drawer-open .chat-fab{transform:translateX(calc(100% + 24px)) !important;opacity:0 !important;filter:blur(6px) !important;pointer-events:none !important}
  /* Round 4 (H): fade both floating buttons out while the user is
     actively scrolling, so they never cover content mid-scroll. */
  body.scrolling .menu-fab,body.scrolling .chat-fab{opacity:0 !important;pointer-events:none !important}
  .chat-fab svg{width:24px;height:24px;flex:none}
  .player-on .chat-fab{bottom:84px}
  .player-on .menu-fab{bottom:84px}
  html[data-theme="dark"] .chat-fab{background:#0f766e;border-color:#0f766e;color:#ffffff;box-shadow:0 2px 10px rgba(0,0,0,.5)}

  /* ---- Drawer settings: theme + language ---- */
  .menu-set{padding:12px 20px 6px}
  .menu-set-label{font-size:.85rem;font-weight:700;color:#6b7280;margin-bottom:8px}
  .seg-mini{display:flex;gap:6px}
  .seg-mini button{flex:1;font-size:.88rem;font-weight:600;color:#1f2937;
    border:1px solid #d1d5db;border-radius:8px;padding:8px 6px;background:transparent}
  .seg-mini button:active{background:#e5e7eb}
  .seg-mini button.on{background:#0f766e;border-color:#0f766e;color:#ffffff}

  /* ---- Chat: plain message list on the background ---- */
  main{padding-top:65px;padding-bottom:120px}
  .sess-bar{display:flex;align-items:center;gap:8px;padding:12px 16px 0}
  .sess-btn{flex:none;font-size:.85rem;font-weight:600;color:#1f2937;
    border:1px solid #d1d5db;border-radius:8px;padding:6px 12px;background:transparent}
  .sess-btn:active{background:#e5e7eb}
  .sess-list{padding:8px 16px 0}
  .sess-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    padding:10px 0;background:transparent;border:0;border-bottom:1px solid #eef1f0}
  .sess-row:active{background:#eef1f0}
  .sess-title{flex:1;min-width:0;font-size:.9rem;font-weight:600;color:#1f2937;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sess-date{flex:none;font-size:.78rem;color:#6b7280}
  .sess-del{flex:none;font-size:1rem;color:#6b7280;padding:4px 8px}
  .sess-del:active{background:#e5e7eb;border-radius:8px}
  .sess-empty{padding:12px 16px 0;font-size:.85rem;color:#6b7280}
  .msgs{padding:12px 16px 0;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:85%;padding:10px 12px;border-radius:14px;font-size:.95rem;line-height:1.55;
    white-space:pre-wrap;word-break:break-word}
  .msg.user{align-self:flex-end;background:#0f766e;color:#ffffff;border-bottom-right-radius:4px}
  .msg.ai{align-self:flex-start;background:#eef1f0;color:#1f2937;border-bottom-left-radius:4px}
  .msg.err{align-self:flex-start;background:#fee2e2;color:#991b1b;border-bottom-left-radius:4px}
  .msg .msg-media{margin-top:8px}
  .msg img.chat-img{width:100%;border-radius:10px;display:block}
  .msg video.chat-vid{width:100%;border-radius:10px;display:block}
  .msg .dl-link{display:inline-block;margin-top:6px;font-size:.85rem;color:#0f766e;text-decoration:underline}
  .msg.user .dl-link{color:#ffffff}
  .msg .prog{font-size:.85rem;color:#6b7280;margin-top:6px}
  .msg .prog .secs{font-weight:700;color:#1f2937}
  .msg.user .prog{color:#d1fae5}
  .msg.user .prog .secs{color:#ffffff}
  .song-acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .act-btn{font-size:.82rem;font-weight:600;color:#1f2937;
    border:1px solid #d1d5db;border-radius:8px;padding:6px 10px;background:#ffffff}
  .act-btn:active{background:#e5e7eb}
  .style-row{display:flex;gap:6px;margin-top:8px}
  .style-row input{flex:1;min-width:0;font:inherit;font-size:.9rem;color:#1f2937;
    background:#ffffff;border:1px solid #d1d5db;border-radius:8px;padding:7px 10px}
  .confirm-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:8px}
  .confirm-row .confirm-text{flex:1;min-width:140px;font-size:.88rem}
  .typing{display:inline-flex;gap:4px;align-items:center;padding:12px 14px}
  .typing i{width:7px;height:7px;border-radius:50%;background:#6b7280;animation:blink 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.2s}
  .typing i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}
  .signin-bar{padding:10px 16px 0;text-align:center;font-size:.88rem;color:#6b7280}
  .signin-bar a{color:#0f766e;text-decoration:underline;font-weight:600}
  .input-bar{position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:linear-gradient(180deg,#e8f5f0 0%,#f2faf6 45%,#ffffff 100%);
    background-attachment:fixed;border-top:1px solid #e5e7eb;
    padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px)) 84px;}
  .input-in{max-width:720px;margin:0 auto;display:flex;align-items:flex-end;gap:8px}
  .input-in textarea{flex:1;min-width:0;font:inherit;font-size:.95rem;color:#1f2937;
    background:#ffffff;border:1px solid #d1d5db;border-radius:12px;padding:10px 12px;
    resize:none;max-height:120px;line-height:1.4}
  .input-in textarea:focus{outline:2px solid #0f766e;border-color:#0f766e}
  .input-in textarea:disabled{background:#eef1f0;color:#6b7280}
  .send-btn{flex:none;font-size:.95rem;font-weight:700;color:#ffffff;
    background:linear-gradient(90deg,#ff2d78,#ff7a18);border-radius:12px;padding:11px 16px}
  .send-btn:active{opacity:.85}
  .send-btn:disabled{background:#9ca3af}

  /* ---- Night theme: same layout, dark green-tinted background ---- */
  html[data-theme="dark"]{background:#000000}
  html[data-theme="dark"] body{background:#000000;color:#e7f0ec}
  html[data-theme="dark"] a{color:#e7f0ec}
  html[data-theme="dark"] header{background:#000000}
  html[data-theme="dark"] .hdr-top,html[data-theme="dark"] .hdr-sub{border-bottom-color:#262626}
  html[data-theme="dark"] .hdr-logo b,html[data-theme="dark"] .hdr-sec-name{color:#e7f0ec}
  html[data-theme="dark"] .hdr-btn{color:#e7f0ec;border-color:#333333}
  html[data-theme="dark"] .hdr-btn:active{background:#1a1a1a}
  html[data-theme="dark"] .menu-fab{background:#000000;border-color:#333333;color:#e7f0ec;box-shadow:0 2px 10px rgba(0,0,0,.5)}
  html[data-theme="dark"] .menu-fab:active{background:#1a1a1a}
  html[data-theme="dark"] .menu-veil{background:rgba(14,26,21,.6)}
  html[data-theme="dark"] .menu{background:#000000;border-top-color:#262626}
  html[data-theme="dark"] .menu a,html[data-theme="dark"] .menu button.menu-link{color:#e7f0ec;border-bottom-color:#262626}
  html[data-theme="dark"] .menu a:active,html[data-theme="dark"] .menu button.menu-link:active{background:#1a1a1a}
  html[data-theme="dark"] .menu .menu-sep{background:#262626}
  html[data-theme="dark"] .menu .menu-user{color:#9ca3af}
  html[data-theme="dark"] .menu-set-label{color:#9ca3af}
  html[data-theme="dark"] .seg-mini button{color:#e7f0ec;border-color:#333333}
  html[data-theme="dark"] .seg-mini button:active{background:#1a1a1a}
  html[data-theme="dark"] .seg-mini button.on{background:#0f766e;border-color:#0f766e;color:#ffffff}
  html[data-theme="dark"] .sess-btn{color:#e7f0ec;border-color:#333333}
  html[data-theme="dark"] .sess-btn:active{background:#1a1a1a}
  html[data-theme="dark"] .sess-row{border-bottom-color:#262626}
  html[data-theme="dark"] .sess-row:active{background:#1a1a1a}
  html[data-theme="dark"] .sess-title{color:#e7f0ec}
  html[data-theme="dark"] .sess-date,html[data-theme="dark"] .sess-del,html[data-theme="dark"] .sess-empty{color:#9ca3af}
  html[data-theme="dark"] .sess-del:active{background:#1a1a1a}
  html[data-theme="dark"] .msg.ai{background:#1a1a1a;color:#e7f0ec}
  html[data-theme="dark"] .msg.err{background:#3f1d1d;color:#fca5a5}
  html[data-theme="dark"] .msg .dl-link{color:#2dd4bf}
  html[data-theme="dark"] .msg .prog{color:#9ca3af}
  html[data-theme="dark"] .msg .prog .secs{color:#e7f0ec}
  html[data-theme="dark"] .act-btn{color:#e7f0ec;border-color:#333333;background:#000000}
  html[data-theme="dark"] .act-btn:active{background:#1a1a1a}
  html[data-theme="dark"] .style-row input{background:#000000;border-color:#333333;color:#e7f0ec}
  html[data-theme="dark"] .typing i{background:#9ca3af}
  html[data-theme="dark"] .input-bar{background:#000000;border-top-color:#262626}
  html[data-theme="dark"] .input-in textarea{background:#000000;border-color:#333333;color:#e7f0ec}
  html[data-theme="dark"] .input-in textarea:disabled{background:#1a1a1a;color:#9ca3af}
  html[data-theme="dark"] .input-in textarea:focus{outline-color:#2dd4bf;border-color:#2dd4bf}
  html[data-theme="dark"] .send-btn:disabled{background:#333333}
  html[data-theme="dark"] .signin-bar{color:#9ca3af}
  html[data-theme="dark"] .signin-bar a{color:#2dd4bf}
  .hdr-back{font-size:1.5rem;font-weight:700;color:inherit;text-decoration:none;padding:0 10px 0 0;line-height:1.2}
  /* ---- Chat identity header: big logo + name + Online, stuck at the top ---- */
  .chat-hdr{padding-top:10px;padding-bottom:10px}
  .chat-logo{flex:none;width:44px;height:44px;border-radius:12px}
  .chat-id{flex-direction:column;align-items:flex-start;gap:1px}
  .hdr-online{font-size:.8rem;font-weight:600;color:#16a34a;display:flex;align-items:center;gap:4px}
  .online-check{font-weight:800}
  .hdr-dots{font-size:1.3rem;font-weight:800;line-height:1;padding:6px 10px}
  .msg img.chat-img{cursor:pointer}
  .msg a.dl-btn{display:inline-block;margin-top:6px;padding:10px 14px;border-radius:10px;background:#0f766e;color:#fff;font-weight:700;text-decoration:none}
  /* ---- Session date groups (not one flat list) ---- */
  .sess-group{padding:14px 16px 4px;font-size:.8rem;font-weight:700;color:#6b7280}
  /* ---- Created items (header ⋮ menu) ---- */
  .created-veil{position:fixed;inset:0;z-index:70;display:none;background:rgba(0,0,0,.25)}
  .created-veil.open{display:block}
  .created-menu{position:fixed;z-index:71;min-width:240px;max-width:calc(100vw - 32px);max-height:60vh;overflow-y:auto;
    background:#ffffff;border:1px solid #d1d5db;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.18);padding:6px 0;display:none}
  .created-menu.open{display:block}
  .created-menu .cm-title{padding:10px 16px 6px;font-size:.85rem;font-weight:700;color:#6b7280}
  .created-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 16px;background:transparent;border:0;border-bottom:1px solid #eef1f0}
  .created-item:active{background:#eef1f0}
  .created-item .ci-name{flex:1;min-width:0;font-size:.9rem;font-weight:600;color:#1f2937;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .created-item .ci-date{flex:none;font-size:.78rem;color:#6b7280}
  .created-item .ci-ic{display:inline-flex;flex:none;line-height:0}
  .created-item .ci-ic svg{display:block;width:18px;height:18px}
  .created-empty{padding:12px 16px;font-size:.85rem;color:#6b7280}
  /* ---- Full-screen image/video viewer ---- */
  .viewer{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.94);display:none;align-items:center;justify-content:center}
  .viewer.open{display:flex}
  .viewer img,.viewer video{max-width:100vw;max-height:100vh;object-fit:contain}
  .viewer .vw-close{position:fixed;top:14px;right:14px;z-index:101;width:40px;height:40px;border-radius:50%;
    background:rgba(255,255,255,.15);color:#fff;font-size:1.3rem;display:flex;align-items:center;justify-content:center}
  .viewer .vw-dl{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:101;
    background:#0f766e;color:#fff;font-weight:700;border-radius:10px;padding:10px 18px;text-decoration:none}
  /* ---- Image progress: a square panel, shimmer squares drifting,
     a shadow ring spinning around inside it, percentage in the center ---- */
  .img-ph{position:relative;width:100%;max-width:320px;aspect-ratio:1/1;border-radius:12px;overflow:hidden;
    background:#dbeafe;border:1px solid #bfdbfe}
  .img-ph-grid{position:absolute;inset:0;
    background-image:linear-gradient(rgba(15,118,110,.25) 1px,transparent 1px),linear-gradient(90deg,rgba(15,118,110,.25) 1px,transparent 1px);
    background-size:24px 24px;animation:phGrid 2.4s ease-in-out infinite alternate}
  @keyframes phGrid{from{background-position:0 0}to{background-position:12px 12px}}
  .img-ph-ring{position:absolute;inset:0;border-radius:12px;border:3px solid transparent;
    background:conic-gradient(from 0deg,#0f766e,transparent 25%,transparent 50%,#0f766e 75%,transparent) border-box;
    -webkit-mask:linear-gradient(#fff 0 0) padding-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;
    mask:linear-gradient(#fff 0 0) padding-box,linear-gradient(#fff 0 0);mask-composite:exclude;
    animation:phSpin 2.5s linear infinite}
  @keyframes phSpin{to{transform:rotate(360deg)}}
  .img-ph-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
  .img-ph-num .pct{font-size:2rem;font-weight:800;color:#0f766e;line-height:1}
  .img-ph-num .secs{font-size:.85rem;font-weight:600;color:#1f2937}
  html[data-theme="dark"] .hdr-online{color:#4ade80}
  html[data-theme="dark"] .sess-group{color:#9ca3af}
  html[data-theme="dark"] .created-menu{background:#000000;border-color:#333333}
  html[data-theme="dark"] .created-menu .cm-title{color:#9ca3af}
  html[data-theme="dark"] .created-item{border-bottom-color:#262626}
  html[data-theme="dark"] .created-item:active{background:#1a1a1a}
  html[data-theme="dark"] .created-item .ci-name{color:#e7f0ec}
  html[data-theme="dark"] .created-item .ci-date,html[data-theme="dark"] .created-empty{color:#9ca3af}
  html[data-theme="dark"] .img-ph{background:#000000;border-color:#333333}
  html[data-theme="dark"] .img-ph-grid{background-image:linear-gradient(rgba(45,212,191,.3) 1px,transparent 1px),linear-gradient(90deg,rgba(45,212,191,.3) 1px,transparent 1px)}
  html[data-theme="dark"] .img-ph-num .pct{color:#2dd4bf}
  html[data-theme="dark"] .img-ph-num .secs{color:#e7f0ec}


  /* chat photo editor + hide the menu button while in chat (2026-11-23) */
  .menu-fab{transform:translateX(calc(-100% - 24px)) !important;opacity:0 !important;pointer-events:none !important}
  .up-btn{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid #cbd5d1;background:#ffffff;color:#0d9488;font-size:20px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .up-btn svg{width:22px;height:22px;fill:currentColor}

  /* ---- reply parsing ----
     The server strips square brackets from replies, so song sections arrive
     bare (Verse 1, Chorus ...) and VOICE:/PACKAGE: tags arrive bare too. */
  function parseActions(raw){
    var out = { text: String(raw || ""), voice: null, pkg: null, imgPrompt: null, vidPrompt: null };
    var m;
    m = out.text.match(/^[ \t]*\[?VOICE:(male|female)\]?[ \t]*$/im);
    if (m) out.voice = m[1].toLowerCase();
    m = out.text.match(/^[ \t]*\[?PACKAGE:([a-z0-9][a-z0-9-]*)\]?[ \t]*$/im);
    if (m) out.pkg = m[1].toLowerCase();
    m = out.text.match(/^IMAGE PROMPT:\s*(.+)$/im);
    if (m) out.imgPrompt = m[1].trim();
    m = out.text.match(/^VIDEO PROMPT:\s*(.+)$/im);
    if (m) out.vidPrompt = m[1].trim();
    out.text = out.text
      .replace(/^[ \t]*\[?VOICE:(male|female)\]?[ \t]*$/gim, "")
      .replace(/^[ \t]*\[?PACKAGE:[a-z0-9][a-z0-9-]*\]?[ \t]*$/gim, "")
      .replace(/^IMAGE PROMPT:\s*.+$/gim, "")
      .replace(/^VIDEO PROMPT:\s*.+$/gim, "")
      .replace(/[ \t]+\n/g, "\n").replace(/\n{3,}/g, "\n\n").replace(/^\s+|\s+$/g, "");
    return out;
  }
  function isSongText(text){
    var lines = String(text || "").split("\n");
    var n = 0;
    for (var i = 0; i < lines.length; i++) {
      if (/^\s*(Intro|Verse 1|Verse 2|Pre-Chorus|Chorus|Bridge|Final Chorus|Outro|Instrumental|Rap)(\s*[–\-]\s*.*)?\s*$/.test(lines[i])) n++;
    }
    return n >= 2;
  }
  function parseSong(text, source){
    var title = "";
    var m = text.match(/^Title:\s*(.+)$/m);
    if (m) title = m[1].trim();
    var style = "";
    var m2 = text.match(/^Music Style:\s*(.+)$/m);
    if (m2) style = m2[1].trim();
    if (!style) {
      var m3 = text.match(/^\s*Intro\s*[–\-]\s*(.+)$/m);
      if (m3) style = m3[1].trim();
    }
    var lyrics = text.replace(/^Title:.*$/m, "").replace(/^Music Style:.*$/m, "").replace(/^\s+/, "").replace(/\s+$/, "");
    return { title: title, style: style, lyrics: lyrics, source: source || "" };
  }

  function copyText(text, btn){
    var done = function(){
      if (!btn) return;

    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(String(text || "")).then(done, function(){ fallbackCopy(text, done); });
    } else fallbackCopy(text, done);
  }
  function fallbackCopy(text, done){
    try {
      var ta = document.createElement("textarea");
      ta.value = String(text || "");
      ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
    } catch (e) {}
    if (done) done();
  }

  /* ---- chat media download (Stage 34): Chrome ignores the `download`
     attribute on cross-origin links, so a plain <a download> to a
     Cloudinary/provider image OPENS it in a tab instead of saving it.
     Same blob-download as My Songs (fetch -> blob -> object URL ->
     a.download -> click), so tapping Download saves the file like an
     MP3 download does. Shows "Downloading..." on the tapped link while
     fetching; on failure shows the error and falls back to opening
     the URL (the old behaviour). ---- */
  function chatMediaFileName(url, kind){
    var m = String(url || "").match(/\.(png|jpe?g|webp|gif|mp4|webm)(?:[?#]|$)/i);
    var ext = m ? m[1].toLowerCase().replace("jpeg", "jpg") : (kind === "video" ? "mp4" : "png");
    return "MovAi-" + Date.now().toString(36) + "." + ext;
  }
  function downloadChatMedia(url, kind, btn){
    if (!url) return;
    if (btn && btn.getAttribute("data-busy") === "1") return;
    if (btn) { btn.setAttribute("data-busy", "1"); btn.textContent = t("downloading"); }
    fetch(url, { mode: "cors" }).then(function(r){
      if (!r.ok) throw new Error("http " + r.status);
      return r.blob();
    }).then(function(blob){
      var objUrl = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = objUrl;
      a.download = chatMediaFileName(url, kind);
      document.body.appendChild(a);
      a.click();
      setTimeout(function(){ try { URL.revokeObjectURL(objUrl); } catch (e) {} try { a.remove(); } catch (e) {} }, 5000);
      if (btn) { btn.setAttribute("data-busy", ""); btn.textContent = t("download"); }
    }).catch(function(){
      if (btn) { btn.setAttribute("data-busy", ""); btn.textContent = t("downloadFailed"); setTimeout(function(){ try { btn.textContent = t("download"); } catch (e) {} }, 3000); }
      try { window.open(url, "_blank"); } catch (e) {}
    });
  }

  /* ---- image progress: a square panel, shimmer squares drifting,
     a shadow ring spinning around inside it, and the percentage in
     the center. The % is time-based (the image providers report no
     progress) — it rises with real elapsed seconds, caps at 99%,
     and the image arriving is the 100%. The seconds under it are
     the real elapsed time. ---- */
  function makeImageProgressBubble(){
    var div = el("div", "msg ai");
    div.appendChild(el("div", null, t("creatingImage")));
    var ph = el("div", "img-ph");
    var grid = el("div", "img-ph-grid");

    var num = el("div", "img-ph-num");
    var pct = el("span", "pct", "0%");
    var secs = el("span", "secs", "0s");
    num.appendChild(pct); num.appendChild(secs);
    ph.appendChild(grid); ph.appendChild(ring); ph.appendChild(num);
    div.appendChild(ph);
    msgsEl.appendChild(div);
    var t0 = Date.now();
    var timer = setInterval(function(){
      var s = Math.floor((Date.now() - t0) / 1000);
      secs.textContent = s + "s";
      pct.textContent = Math.min(99, Math.floor(s / 60 * 100)) + "%";
    }, 500);
    scrollBottom();
    return { el: div, stop: function(){ clearInterval(timer); } };
  }


  /* ---- photo editing in the chat (owner order 2026-11-23) ----
     Upload a photo in the chat -> the photo appears IN the chat as the
     user's own message -> the user types what to change as a normal
     chat message -> that message goes to the EDIT flow (not a new
     image, not a chat text reply) -> 50-Credit confirm first (same
     pattern as video) -> /api/gen/image/edit -> poll the existing
     image status -> the edited photo lands in the chat, same person
     kept. The photo is uploaded at pick time (free, no credits) so
     it shows in the chat right away; pendingPhoto is session-only
     and clears on a new/changed session or on Cancel. ---- */
  var imgUpBtn = document.getElementById("chatImgUp");
  var imgFileEl = document.getElementById("chatImgFile");
  var pendingPhoto = null;
  if (imgUpBtn) imgUpBtn.addEventListener("click", function(){
    if (!getEmail()) {
      var bar = document.getElementById("signinBar");
      if (bar) bar.hidden = false;
      addError(t("signInToChat"));

    }

  });
  if (imgFileEl) imgFileEl.addEventListener("change", function(){
    var f = imgFileEl.files && imgFileEl.files[0];
    if (!f) return;
    if (!/^image\//.test(f.type || "")) { addError(t("badPhoto")); imgFileEl.value = ""; return; }
    var rd = new FileReader();
    rd.onload = function(){
      var dataUrl = String(rd.result || "");
      if (!dataUrl) return;
      var b64 = dataUrl.split(",")[1] || "";
      apiPost("/api/gen/image/upload", { email: getEmail(), filename: f.name || "photo.jpg", data: b64 }, 120000).then(function(j){
        if (!j || j.ok !== true || !j.url) { addError((j && j.error) || t("noServer")); return; }
        pendingPhoto = { url: j.url, name: f.name || "photo.jpg" };
        cur.messages.push({ role: "user", content: "", at: Date.now(), media: [{ kind: "image", url: j.url, prompt: "" }] });
        touchSession();
        renderMessages();
      }).catch(function(){ addError(t("noServer")); });
    };

  function askChatEdit(instruction, done){
    var div = el("div", "msg ai");
    var row = el("div", "confirm-row");
    var tx = el("span", "confirm-text", t("editConfirmWith") + "\u00ab" + instruction + "\u00bb \u2014 " + t("editChoiceNote"));
    var freeBtn = el("button", "act-btn", t("editFreeBtn"));

  var imgEditBusy = false;
  function runChatEdit(instruction, model, done){
    if (imgEditBusy || !pendingPhoto) { done(); return; }
    imgEditBusy = true;
    var photoUrl = pendingPhoto.url;
    var prog = makeImageProgressBubble();
    function finishEdit(){ imgEditBusy = false; pendingPhoto = null; done(); }
    function fail(err){ prog.stop(); prog.el.remove(); addError(err); finishEdit(); }
    apiPost("/api/gen/image/edit", { email: getEmail(), imageUrl: photoUrl, prompt: instruction, model: model || "magichour" }, 120000).then(function(e){
      if (!e || e.ok !== true) { fail((e && e.error) || t("noServer")); return; }
      if (e.url) {
        prog.stop(); prog.el.remove();
        cur.messages.push({ role: "assistant", content: "", at: Date.now(), media: [{ kind: "image", url: e.url, prompt: instruction }] });
        touchSession();
        renderMessages();
        finishEdit();
        return;
      }
      if (e.jobId) {
        pollJob("image", "magichour", e.jobId, function(r){
          if (r.ok) {
            prog.stop(); prog.el.remove();
            cur.messages.push({ role: "assistant", content: "", at: Date.now(), media: [{ kind: "image", url: r.url, prompt: instruction }] });
            touchSession();
            renderMessages();
            finishEdit();
          } else fail(r.error);
        });
        return;
      }
      fail(t("noServer"));
    }).catch(function(){ fail(t("noServer")); });
  }
  // A photo uploaded in the previous visit is still the pending photo
  // (it is the last message of this session) — the user can keep
  // telling the chat what to do with it.
  if (!pendingPhoto && cur && cur.messages && cur.messages.length) {
    var lm = cur.messages[cur.messages.length - 1];
    if (lm && lm.role === "user" && lm.media && lm.media.length) {
      var lu = lm.media[lm.media.length - 1];
      if (lu && lu.kind === "image" && lu.url) pendingPhoto = { url: lu.url, name: "photo.jpg" };
    }
  }
  /* ---- downloader (SnapTube-style, cobalt) ----
     Paste a link + say "download as mp3/mp4". Cobalt needs a human
     Turnstile token, so the token is minted in this browser and the
     download request goes straight from the phone to cobalt. YouTube
     goes to the community instance (cobalt-api.meowing.de, the only
     one with YouTube on); everything else goes to the official
     instance (api.cobalt.tools). No MovAi credits are charged —
     cobalt is free. Facebook has no MP3 — only MP4. */
  function downloadIntent(text){
    var m = String(text || "").match(/https?:\/\/[^\s]+/);
    if (!m) return null;
    if (!/download|ដោនឡូត|\bmp3\b|\bmp4\b/i.test(text)) return null;
    var url = m[0].replace(/[.,;)\]]+$/, "");
    var format = /\bmp4\b/i.test(text) ? "mp4" : (/\bmp3\b/i.test(text) ? "mp3" : "");
    return { url: url, format: format };
  }
  function cobaltInstanceFor(url){
    var u = String(url || "").toLowerCase();
    if (u.indexOf("youtube.com") >= 0 || u.indexOf("youtu.be") >= 0) return "https://cobalt-api.meowing.de/";
    return "https://api.cobalt.tools/";
  }
  function isFacebookUrl(url){
    var u = String(url || "").toLowerCase();
    return u.indexOf("facebook.com") >= 0 || u.indexOf("fb.watch") >= 0;
  }
  function getTurnstileToken(sitekey){
    return new Promise(function(resolve){
      var done = false, timer = null;
      function res(v){ if (!done) { done = true; if (timer) clearTimeout(timer); resolve(v); } }
      if (!window.turnstile) { res(""); return; }
      var box = document.getElementById("tsBox");
      if (!box) { res(""); return; }
      try {
        var wid = window.turnstile.render(box, { sitekey: sitekey, size: "invisible",
          callback: function(tok){ try { window.turnstile.remove(wid); } catch (e) {} res(tok || ""); },
          "error-callback": function(){ res(""); },
          "expired-callback": function(){ res(""); } });
        window.turnstile.execute(wid);
      } catch (e) { res(""); return; }
      timer = setTimeout(function(){ res(""); }, 60000);
    });
  }
  function runCobaltDownload(url, format, done){
    var inst = cobaltInstanceFor(url);
    var prog = makeProgressBubble("downloading");
    function fail(err){ try { prog.stop(); } catch (e) {} try { prog.el.remove(); } catch (e) {} addError(err); done(); }
    fetch(inst, { method: "GET" }).then(function(r){ return r.json(); }).then(function(info){
      var sitekey = info && info.cobalt && info.cobalt.turnstileSitekey;
      if (!sitekey) { fail(t("downloadFailed") + " (no turnstile)"); return; }
      getTurnstileToken(sitekey).then(function(tok){
        if (!tok) { fail(t("downloadFailed") + " (turnstile)"); return; }
        fetch(inst + "session", { method: "POST", headers: { "cf-turnstile-response": tok } }).then(function(r){ return r.json(); }).then(function(s){
          var jwt = s && s.token;
          if (!jwt) { fail((s && s.error && (s.error.message || s.error.code)) || t("downloadFailed")); return; }
          var body = { url: url, downloadMode: format === "mp3" ? "audio" : "auto", filenameStyle: "basic" };
          if (format === "mp3") body.audioFormat = "mp3"; else body.videoQuality = "720";
          fetch(inst, { method: "POST", headers: { "Accept": "application/json", "Content-Type": "application/json", "Authorization": "Bearer " + jwt }, body: JSON.stringify(body) }).then(function(r){ return r.json(); }).then(function(j){
            try { prog.stop(); } catch (e) {}
            try { prog.el.remove(); } catch (e) {}
            if (j && (j.status === "redirect" || j.status === "tunnel") && j.url) {
              cur.messages.push({ role: "assistant", content: "", media: [{ kind: "download", url: j.url, format: format, prompt: j.filename || "" }], at: Date.now() });
              touchSession(); renderMessages(); done(); return;
            }
            if (j && j.status === "picker" && Array.isArray(j.picker) && j.picker.length) {
              var pick = null;
              for (var i = 0; i < j.picker.length; i++) {
                if (format === "mp3" ? j.picker[i].type === "audio" : j.picker[i].type === "video") { pick = j.picker[i]; break; }
              }
              if (!pick) pick = j.picker[0];
              if (pick && pick.url) {
                cur.messages.push({ role: "assistant", content: "", media: [{ kind: "download", url: pick.url, format: format, prompt: j.filename || "" }], at: Date.now() });
                touchSession(); renderMessages(); done(); return;
              }
            }
            fail((j && j.error && (j.error.message || j.error.code)) || t("downloadFailed"));
          }).catch(function(){ fail(t("noServer")); });
        }).catch(function(){ fail(t("noServer")); });
      });
    }).catch(function(){ fail(t("noServer")); });
  }
  function runDownload(url, format, done){
    if (!format) {
      // No format said yet: ask with two buttons. The chooser releases
      // the input right away (done now); the buttons download on tap.
      var wrap = el("div", "msg ai");
      wrap.appendChild(document.createTextNode(t("chooseFormat")));
      var row = el("div", "song-acts");
      if (!isFacebookUrl(url)) {
        var b3 = el("button", "act-btn", "MP3");
        b3.type = "button";
        b3.addEventListener("click", function(){ wrap.remove(); runCobaltDownload(url, "mp3", function(){}); });
        row.appendChild(b3);
      } else {
        wrap.appendChild(el("div", "prog", t("fbNoMp3")));
      }
      var b4 = el("button", "act-btn", "MP4");
      b4.type = "button";
      b4.addEventListener("click", function(){ wrap.remove(); runCobaltDownload(url, "mp4", function(){}); });
      row.appendChild(b4);
      wrap.appendChild(row);
      msgsEl.appendChild(wrap);
      scrollBottom();
      done();
      return;
    }
    if (format === "mp3" && isFacebookUrl(url)) { addError(t("fbNoMp3")); done(); return; }
    runCobaltDownload(url, format, done);
  }

  /* ---- intent + send ---- */
  function detectKind(text){
    var s = String(text || "");
    if (/វីដេអូ|ភាពយន្ត|\bvideo\b|\bmovie\b|\bfilm\b/i.test(s)) return "video";
    if (/រូបភាព|រូបថត|\bimage\b|\bphoto\b|\bpicture\b/i.test(s)) return "image";
    return "chat";
  }
  function lastImageUrl(){
    for (var i = cur.messages.length - 1; i >= 0; i--) {
      var m = cur.messages[i];
      if (m && m.media) {
        for (var j = m.media.length - 1; j >= 0; j--) {
          if (m.media[j].kind === "image" && m.media[j].url) return m.media[j].url;
        }
      }
    }
    return "";
  }
  function wantsLastImage(text){
    return /រូប(ហ្នឹង|នេះ|នោះ)|that image|this image|turn (it|that|this) into/i.test(String(text || ""));
  }
  function imageSizeFor(text){
    var s = String(text || "");
    if (/9\s*:\s*16/.test(s)) return { w: 432, h: 768 };
    if (/1\s*:\s*1/.test(s)) return { w: 768, h: 768 };
    return { w: 768, h: 432 };
  }
  function sendChat(text, done){
    showTyping();
    var hist = [];
    var ms = cur.messages;
    var start = Math.max(0, ms.length - 11);
    for (var i = start; i < ms.length - 1; i++) {
      var mm = ms[i];
      if (!mm || (mm.role !== "user" && mm.role !== "assistant")) continue;
      var c = String(mm.content || "").trim();
      if (!c) continue;
      hist.push({ role: mm.role, content: c.slice(0, 2000) });
    }
    apiPost("/api/chat", { email: getEmail(), message: text, history: hist }, 60000).then(function(j){
      hideTyping();
      if (done) done();
      if (!j || j.ok !== true) { addError((j && j.error) ? j.error : t("noServer")); return; }
      handleReply(String(j.reply || ""), text);
    }).catch(function(){
      hideTyping();
      if (done) done();
      addError(t("noServer"));
    });
  }
  function handleReply(raw, userText){
    var p = parseActions(raw);
    var msg = { role: "assistant", content: p.text, at: Date.now(), media: [] };
    if (p.voice) {
      msg.voice = p.voice;
      try { localStorage.setItem(VOICE_KEY, p.voice); } catch (e) {}
    }
    if (p.pkg) msg.pkg = p.pkg;
    if (isSongText(p.text)) msg.song = parseSong(p.text, userText);
    cur.messages.push(msg);
    touchSession();
    renderMessages();
    if (p.imgPrompt) genImage(p.imgPrompt, msg, function(){});
    if (p.vidPrompt) askVideo(p.vidPrompt, "", function(){});
  }
  function runSend(text, done){
    var d = done || function(){};
    var dl = downloadIntent(text);
    if (dl) { runDownload(dl.url, dl.format, d); return; }
    if (pendingPhoto) { askChatEdit(text, d); return; }
    var kind = detectKind(text);
    if (kind === "image") { genImage(text, null, d); return; }
    if (kind === "video") {
      var img = wantsLastImage(text) ? lastImageUrl() : "";
      askVideo(text, img, d);
      return;
    }
    sendChat(text, d);
  }
  function sendUser(text){
    text = String(text || "").trim();
    if (!text || busy) return;
    if (!getEmail()) return;
    busy = true;
    var m = { role: "user", content: text, at: Date.now() };
    cur.messages.push(m);
    if (!cur.title) cur.title = text.slice(0, 40);
    touchSession();
    renderMessages();
    inputEl.value = "";
    autoGrow();
    runSend(text, function(){ busy = false; });
  }

  /* ---- image / video generation (existing endpoints only) ---- */
  function makeProgressBubble(labelKey){
    var div = el("div", "msg ai");
    var label = el("div", null, t(labelKey));
    var prog = el("div", "prog");
    var secs = el("span", "secs", "0s");
    prog.appendChild(secs);
    div.appendChild(label);
    div.appendChild(prog);
    msgsEl.appendChild(div);
    var t0 = Date.now();
    var timer = setInterval(function(){
      secs.textContent = Math.floor((Date.now() - t0) / 1000) + "s";
    }, 1000);
    scrollBottom();
    return { el: div, stop: function(){ clearInterval(timer); } };
  }
  function pollJob(kind, provider, jobId, onDone){
    var t0 = Date.now();
    var timer = setInterval(function(){
      if (Date.now() - t0 > 10 * 60 * 1000) { clearInterval(timer); onDone({ ok: false, error: t("noServer") }); return; }
      apiPost(kind === "image" ? "/api/gen/image/status" : "/api/gen/video/status", { email: getEmail(), provider: provider, jobId: jobId }, 30000).then(function(j){
        if (!j) return;
        if (j.ok !== true) { clearInterval(timer); onDone({ ok: false, error: j.error || t("noServer") }); return; }
        if (j.status === "done") {
          var url = kind === "image" ? (j.imageUrl || "") : (j.videoUrl || "");
          clearInterval(timer);
          if (url) onDone({ ok: true, url: url });
          else onDone({ ok: false, error: t("noServer") });
        } else if (j.status === "failed") {
          clearInterval(timer);
          onDone({ ok: false, error: j.error || t("noServer") });
        }
      }).catch(function(){ /* transient error: keep polling */ });
    }, 5000);
  }
  function genImage(prompt, attachTo, done){
    var sz = imageSizeFor(prompt);
    var prog = makeImageProgressBubble();
    function finish(url){
      prog.stop(); prog.el.remove();
      var m = { kind: "image", url: url, prompt: prompt };
      if (attachTo) { attachTo.media = attachTo.media || []; attachTo.media.push(m); }
      else { cur.messages.push({ role: "assistant", content: "", at: Date.now(), media: [m] }); }
      touchSession();
      renderMessages();
      if (done) done();
    }
    function fail(err){
      prog.stop(); prog.el.remove();
      addError(err);
      if (done) done();
    }
    apiPost("/api/gen/image", { email: getEmail(), provider: "auto", prompt: prompt, width: sz.w, height: sz.h }, 300000).then(function(j){
      if (!j) { fail(t("noServer")); return; }
      var url = j.imageUrl || j.image_url || j.url || "";
      if (url) { finish(url); return; }
      if (j.jobId) {
        pollJob("image", j.provider || "agnes", j.jobId, function(r){
          if (r.ok) finish(r.url);
          else fail(r.error);
        });
        return;
      }
      fail(j.error || t("noServer"));
    }).catch(function(){ fail(t("noServer")); });
  }
  function askVideo(prompt, imageUrl, done){
    if (featureSettings.videoGenLocked) { addError(t("videoGenLocked")); if (done) done(); return; }
    var div = el("div", "msg ai");
    var row = el("div", "confirm-row");
    var tx = el("span", "confirm-text", t("videoConfirm"));
    var ok = el("button", "act-btn", t("approve"));
    ok.type = "button";
    var no = el("button", "act-btn", t("cancel"));
    no.type = "button";
    row.appendChild(tx); row.appendChild(ok); row.appendChild(no);
    div.appendChild(row);
    msgsEl.appendChild(div);
    scrollBottom();
    ok.addEventListener("click", function(){
      div.remove();
      runVideo(prompt, imageUrl, done);
    });
    no.addEventListener("click", function(){
      div.remove();
      if (done) done();
    });
  }
  function runVideo(prompt, imageUrl, done){
    if (featureSettings.videoGenLocked) { addError(t("videoGenLocked")); if (done) done(); return; }
    var prog = makeProgressBubble("creatingVideo");
    var body = { email: getEmail(), provider: "magichour", tier: "normal", model: "ltx-2.5", prompt: prompt, duration: 5, width: 768, height: 432 };
    if (imageUrl) body.imageUrl = imageUrl;
    function finish(url){
      prog.stop(); prog.el.remove();
      cur.messages.push({ role: "assistant", content: "", at: Date.now(), media: [{ kind: "video", url: url, prompt: prompt }] });
      touchSession();
      renderMessages();
      if (done) done();
    }
    function fail(err){
      prog.stop(); prog.el.remove();
      addError(err);
      if (done) done();
    }
    apiPost("/api/gen/video", body, 180000).then(function(j){
      if (!j) { fail(t("noServer")); return; }
      var url = j.videoUrl || j.video_url || j.url || "";
      if (url) { finish(url); return; }
      if (j.jobId) {
        pollJob("video", "magichour", j.jobId, function(r){
          if (r.ok) finish(r.url);
          else fail(r.error);
        });
        return;
      }
      fail(j.error || t("noServer"));
    }).catch(function(){ fail(t("noServer")); });
  }

  /* ---- input ---- */
  function autoGrow(){
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
  }
  inputEl.addEventListener("input", autoGrow);
  inputEl.addEventListener("keydown", function(e){
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendUser(inputEl.value); }
  });
  sendBtn.addEventListener("click", function(){ sendUser(inputEl.value); });
  sessToggle.addEventListener("click", function(){
    sessListEl.hidden = !sessListEl.hidden;
    if (!sessListEl.hidden) renderSessList();
  });
  newChatBtn.addEventListener("click", newSession);

  function gateGuest(){
    var em = getEmail();
    inputEl.disabled = !em;
    sendBtn.disabled = !em;
    signinBar.hidden = !!em;
  }


  /* ---- Round 4 (J): return-to-app snapshot (active session + scroll +
     unsent input). The sessions themselves already persist in
     localStorage; this only restores where he was within the grace. */
  var SNAP_KEY = "movai-snap-chat";
  /* ---- Round 4 (J): return-to-app snapshot, 4-minute grace ----
     A weak phone's Chrome discards the background tab and reloads it on
     return. This site never reloads itself on return - instead it saves
     a small snapshot (scroll + rendered list + player state) when the
     page hides and every 10s, and restores it instantly when the return
     is within GRACE_MS. Older than that: normal fresh load. */
  var GRACE_MS = 4 * 60 * 1000;
  function snapLoad(){
    try {
      var raw = localStorage.getItem(SNAP_KEY);
      if (!raw) return null;
      var s = JSON.parse(raw);
      if (!s || typeof s.savedAt !== "number") return null;
      if (Date.now() - s.savedAt > GRACE_MS) return null;
      return s;
    } catch (e) { return null; }
  }
  document.addEventListener("visibilitychange", function(){ if (document.visibilityState === "hidden") snapSave(); });
  window.addEventListener("pagehide", snapSave);
  window.addEventListener("beforeunload", snapSave);
  setInterval(function(){ if (!document.hidden) snapSave(); }, 10000);
  function snapSave(){
    try {
      localStorage.setItem(SNAP_KEY, JSON.stringify({ savedAt: Date.now(), scrollY: window.scrollY || 0, activeId: cur ? cur.id : "", inputDraft: inputEl ? inputEl.value : "" }));
    } catch (e) {}
  }
  function snapRestore(){
    var s = snapLoad();
    if (!s) return false;
    var switched = false;
    if (typeof s.activeId === "string" && s.activeId && (!cur || cur.id !== s.activeId)) {
      for (var i = 0; i < sessions.length; i++) {
        if (sessions[i].id === s.activeId) {
          cur = sessions[i];
          try { localStorage.setItem(CUR_KEY, cur.id); } catch (e) {}
          switched = true;
          break;
        }
      }
    }
    if (typeof s.inputDraft === "string" && s.inputDraft && inputEl) inputEl.value = s.inputDraft;
    if (switched) { renderSessList(); renderMessages(); }
    if (typeof s.scrollY === "number" && s.scrollY > 0) {
      requestAnimationFrame(function(){ try { window.scrollTo(0, s.scrollY); } catch (e) {} });
      setTimeout(function(){ try { window.scrollTo(0, s.scrollY); } catch (e) {} }, 400);
    }
    return true;
  }

  applyLang();
  renderSessList();
  renderMessages();
  gateGuest();
  loadFeatureSettings();
  snapRestore();
})();
</script>
<script>
(function(){
  "use strict";
  /* ---- Chat button: slides in from the right edge on app open (blurry to
     clear); if untouched for 10s it fades back to blurry, slides out to the
     right and disappears completely; it returns on the next app open. ---- */
  var fab = document.getElementById("chatFab");
  if (!fab) return;
  var HIDE_MS = 10000;
  var hideTimer = null;
  function openChat(){
    if (window.location.pathname && window.location.pathname.indexOf("movai-new-chat.html") !== -1) {
      var inp = document.getElementById("chatInput");
      if (inp) { inp.focus(); }
      window.scrollTo(0, document.body.scrollHeight);
      return;
    }
    window.location.href = "movai-new-chat.html";
  }
  function hideFab(){
    fab.classList.remove("in");
    fab.classList.add("out");
    setTimeout(function(){ fab.style.display = "none"; }, 500);
  }
  function cancelHide(){ if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; } }
  fab.addEventListener("pointerdown", cancelHide);
  fab.addEventListener("mouseenter", cancelHide);
  fab.addEventListener("touchstart", cancelHide, { passive: true });
  fab.addEventListener("focus", cancelHide);
  fab.addEventListener("click", function(e){ e.preventDefault(); cancelHide(); openChat(); });
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      fab.classList.add("in");
      hideTimer = setTimeout(hideFab, HIDE_MS);
    });
  });
})();
</script>
