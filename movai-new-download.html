<style>
  /* MovAi new — clean look, one single pale background, no layers. */
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;overflow-x:hidden}

    background-attachment:fixed;
    min-height:100vh;

  a{color:#1f2937;text-decoration:none}
  button{font:inherit;color:inherit;background:transparent;border:0;padding:0;cursor:pointer}
  img{display:block;max-width:100%}

  .wrap{max-width:720px;margin:0 auto}

  /* ---- Header: two rows, directly on the background (transparent) ---- */
  header{position:fixed;top:0;left:0;right:0;z-index:50;max-width:720px;margin:auto;
    background:linear-gradient(180deg,#e8f5f0 0%,#f2faf6 45%,#ffffff 100%);

  .hdr-row{display:flex;align-items:center;justify-content:space-between;gap:10px;

  .hdr-top{padding-top:14px;padding-bottom:10px;border-bottom:1px solid #e5e7eb}
  .hdr-sub{padding-top:11px;padding-bottom:11px;border-bottom:1px solid #e5e7eb}
  .hdr-logo{display:flex;align-items:center;gap:8px;color:#1f2937;min-width:0}
  .hdr-logo svg,.hdr-logo img{flex:none}

  .hdr-right{display:flex;align-items:center;gap:4px}
  .icon-btn{font-size:1.35rem;line-height:1;color:#1f2937;padding:4px 9px;border-radius:8px}
  .icon-btn:active{background:#e5e7eb}
  .hdr-sec{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
  .hdr-sec .icon-btn{padding:4px 8px}
  .hdr-sec-name{font-size:1rem;font-weight:600;color:#1f2937;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hdr-btn{flex:none;font-size:.9rem;font-weight:600;color:#1f2937;
    border:1px solid #d1d5db;border-radius:8px;padding:6px 12px;background:transparent}
  .hdr-btn:active{background:#e5e7eb}

  /* ---- Bottom menu: fixed bottom-left button, bottom sheet (never rises to the top) ---- */
  .menu-fab{position:fixed;left:16px;bottom:16px;z-index:60;
    width:52px;height:52px;border-radius:50%;
    background:#f2faf6;border:1px solid #d1d5db;
    font-size:1.4rem;line-height:1;color:#1f2937;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 10px rgba(0,0,0,.12);transition:opacity .25s ease}
  .menu-fab:active{background:#e5e7eb}
  .menu-veil{position:fixed;inset:0;z-index:55;display:none;
    background:rgba(242,250,246,.55);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
  .menu-veil.open{display:block;animation:veilIn .18s ease-out}
  @keyframes veilIn{from{opacity:0}to{opacity:1}}
  .menu{position:fixed;left:0;right:0;bottom:0;z-index:56;
    max-height:70vh;overflow-y:auto;
    background:#f2faf6;border-top:1px solid #e5e7eb;border-radius:16px 16px 0 0;
    padding:6px 0 calc(10px + env(safe-area-inset-bottom,0px));
    transform:translateY(105%);transition:transform .22s ease-out;
    visibility:hidden}
  .menu.open{transform:translateY(0);visibility:visible;animation:sheetIn .25s ease-out}
  @keyframes sheetIn{from{filter:blur(6px)}to{filter:blur(0)}}
  .menu.open + .menu-fab{display:none}
  .menu a,.menu button.menu-link{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    padding:13px 20px;font-size:.95rem;color:#1f2937;border-bottom:1px solid #eef1f0;background:transparent}
  .menu a .nav-ic{display:inline-flex;flex:none;line-height:0}
  .menu a .nav-ic svg{display:block;width:20px;height:20px}
  .menu a:last-child,.menu button.menu-link:last-child{border-bottom:0}
  .menu a:active,.menu button.menu-link:active{background:#e5e7eb}
  .menu .menu-sep{height:1px;background:#e5e7eb;margin:6px 0}
  .menu .menu-user{padding:12px 20px 4px;font-size:.85rem;color:#6b7280}
  [hidden]{display:none !important}

  main{padding-top:108px;padding-bottom:120px}

  /* ---- Download Center: plain rows directly on the background ---- */
  .dl-sec{padding:16px}
  .dl-urlrow{display:flex;gap:8px;align-items:stretch}
  .dl-input{flex:1;min-width:0;font:inherit;font-size:.95rem;color:#1f2937;
    background:#ffffff;border:1px solid #d1d5db;border-radius:10px;padding:12px 12px}
  .dl-input:focus{outline:2px solid #0f766e;border-color:#0f766e}
  .dl-paste{flex:none;font-size:.9rem;font-weight:700;color:#ffffff;background:#0f766e;
    border-radius:10px;padding:12px 16px}
  .dl-paste:active{opacity:.85}
  .dl-plat{margin-top:8px;font-size:.85rem;font-weight:700;color:#0f766e;min-height:18px}
  .dl-plat:empty{display:none}
  .dl-lbl{margin-top:16px;font-size:.85rem;font-weight:700;color:#6b7280}
  .dl-chips{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
  .dl-chip{font-size:.92rem;font-weight:700;color:#1f2937;background:#ffffff;
    border:1px solid #d1d5db;border-radius:999px;padding:9px 16px}
  .dl-chip:active{background:#e5e7eb}
  .dl-chip.on{background:#0f766e;border-color:#0f766e;color:#ffffff}
  .dl-go{display:block;width:100%;margin-top:20px;font-size:1rem;font-weight:800;color:#ffffff;
    background:linear-gradient(90deg,#ff2d78,#ff7a18);border-radius:10px;padding:14px 16px}
  .dl-go:active{opacity:.85}
  .dl-go:disabled{opacity:.55}
  .dl-free{margin-top:10px;font-size:.82rem;color:#6b7280;text-align:center}
  .dl-status{margin-top:14px;font-size:.92rem;font-weight:600;color:#1f2937;min-height:20px;font-variant-numeric:tabular-nums}
  .dl-status:empty{display:none}
  .dl-err{margin-top:10px;font-size:.92rem;font-weight:600;color:#991b1b;line-height:1.5;word-break:break-word}
  .dl-err:empty{display:none}
  .dl-note{margin-top:10px;font-size:.85rem;color:#6b7280;line-height:1.5}
  .dl-note:empty{display:none}
  .dl-daily{margin-top:10px;font-size:.85rem;color:#6b7280;text-align:center}
  .dl-daily:empty{display:none}
  .dl-pick{margin-top:14px}
  .dl-pick-title{font-size:.9rem;font-weight:700;color:#1f2937;margin-bottom:8px}
  .dl-pick-item{display:flex;width:100%;align-items:center;gap:10px;text-align:left;
    padding:12px 14px;font-size:.92rem;font-weight:600;color:#1f2937;background:#ffffff;
    border:1px solid #d1d5db;border-radius:10px;margin-bottom:8px}
  .dl-pick-item:active{background:#eef7f4}
  .dl-pick-item .dl-pick-kind{flex:none;font-size:.78rem;font-weight:800;color:#0f766e}
  .dl-pick-item span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dl-result{margin-top:14px}
  .dl-filename{font-size:.9rem;font-weight:600;color:#1f2937;word-break:break-word;line-height:1.5}
  .dl-dlbtn{display:block;width:100%;margin-top:10px;font-size:1rem;font-weight:800;color:#ffffff;
    background:#0f766e;border-radius:10px;padding:14px 16px}
  .dl-dlbtn:active{opacity:.85}
  .dl-dlbtn:disabled{opacity:.55}
  .dl-signin{padding:28px 16px;text-align:center;color:#6b7280;font-size:.95rem;line-height:1.6}
  .dl-signin a{color:#0f766e;font-weight:700;text-decoration:underline}
  /* ---- Drawer settings: theme + language ---- */
  .menu-set{padding:12px 20px 6px}
  .menu-set-label{font-size:.85rem;font-weight:700;color:#6b7280;margin-bottom:8px}
  .seg-mini{display:flex;gap:6px}
  .seg-mini button{flex:1;font-size:.88rem;font-weight:600;color:#1f2937;
    border:1px solid #d1d5db;border-radius:8px;padding:8px 6px;background:transparent}
  .seg-mini button:active{background:#e5e7eb}
  .seg-mini button.on{background:#0f766e;border-color:#0f766e;color:#ffffff}
  /* ---- Chat button: bottom-right, slides in from the right edge ---- */
  .chat-fab{position:fixed;right:16px;bottom:16px;z-index:60;
    width:52px;height:52px;border-radius:50%;
    background:#0f766e;border:1px solid #0f766e;
    color:#ffffff;display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 10px rgba(0,0,0,.18);
    transform:translateX(calc(100% + 24px));opacity:0;filter:blur(6px);
    transition:transform .45s ease-out,opacity .45s ease-out,filter .45s ease-out;
    pointer-events:none}
  .chat-fab.in{transform:translateX(0);opacity:1;filter:blur(0);pointer-events:auto}
  .chat-fab.out{transform:translateX(calc(100% + 24px));opacity:0;filter:blur(6px);pointer-events:none}
  .chat-fab:active{opacity:.85}
  body.drawer-open .chat-fab{transform:translateX(calc(100% + 24px)) !important;opacity:0 !important;filter:blur(6px) !important;pointer-events:none !important}
  body.scrolling .menu-fab,body.scrolling .chat-fab{opacity:0 !important;pointer-events:none !important}
  .chat-fab svg{width:24px;height:24px;flex:none}
  html[data-theme="dark"] .chat-fab{background:#0f766e;border-color:#0f766e;color:#ffffff;box-shadow:0 2px 10px rgba(0,0,0,.5)}
  /* ---- Night theme: same layout, pure black ---- */
  html[data-theme="dark"]{background:#000000}
  html[data-theme="dark"] body{background:#000000;color:#e7f0ec}
  html[data-theme="dark"] a{color:#e7f0ec}
  html[data-theme="dark"] header{background:#000000}

  html[data-theme="dark"] .menu-fab:active{background:#1a1a1a}

  html[data-theme="dark"] .menu a,html[data-theme="dark"] .menu button.menu-link{color:#e7f0ec;border-bottom-color:#262626}
  html[data-theme="dark"] .menu a:active,html[data-theme="dark"] .menu button.menu-link:active{background:#1a1a1a}
  html[data-theme="dark"] .menu .menu-sep{background:#262626}
  html[data-theme="dark"] .menu .menu-user{color:#9ca3af}
  html[data-theme="dark"] .menu-set-label{color:#9ca3af}
  html[data-theme="dark"] .seg-mini button{color:#e7f0ec;border-color:#333333}
  html[data-theme="dark"] .seg-mini button:active{background:#1a1a1a}
  html[data-theme="dark"] .seg-mini button.on{background:#0f766e;border-color:#0f766e;color:#ffffff}
  html[data-theme="dark"] .dl-input{background:#000000;border-color:#333333;color:#e7f0ec}
  html[data-theme="dark"] .dl-input:focus{outline-color:#2dd4bf;border-color:#2dd4bf}
  html[data-theme="dark"] .dl-plat{color:#2dd4bf}
  html[data-theme="dark"] .dl-lbl{color:#9ca3af}
  html[data-theme="dark"] .dl-chip{background:#000000;border-color:#333333;color:#e7f0ec}
  html[data-theme="dark"] .dl-chip:active{background:#1a1a1a}
  html[data-theme="dark"] .dl-chip.on{background:#0f766e;border-color:#0f766e;color:#ffffff}
  html[data-theme="dark"] .dl-free,html[data-theme="dark"] .dl-note,html[data-theme="dark"] .dl-daily{color:#9ca3af}
  html[data-theme="dark"] .dl-status{color:#e7f0ec}
  html[data-theme="dark"] .dl-err{color:#fca5a5}
  html[data-theme="dark"] .dl-pick-title,html[data-theme="dark"] .dl-filename{color:#e7f0ec}
  html[data-theme="dark"] .dl-pick-item{background:#000000;border-color:#333333;color:#e7f0ec}
  html[data-theme="dark"] .dl-pick-item:active{background:#1a1a1a}
  html[data-theme="dark"] .dl-pick-item .dl-pick-kind{color:#2dd4bf}
  html[data-theme="dark"] .dl-signin{color:#9ca3af}
  html[data-theme="dark"] .dl-signin a{color:#2dd4bf}
  .hdr-back{font-size:1.5rem;font-weight:700;color:inherit;text-decoration:none;padding:0 10px 0 0;line-height:1.2}
</style>

  }
  function platKey(p){
    if (p === "youtube") return "dlPlatYoutube";
    if (p === "tiktok") return "dlPlatTiktok";
    if (p === "facebook") return "dlPlatFacebook";
    if (p === "instagram") return "dlPlatInstagram";
    return "dlPlatOther";
  }

  var urlInput = document.getElementById("dlUrl");
  var pasteBtn = document.getElementById("dlPaste");
  var platEl = document.getElementById("dlPlat");
  var goBtn = document.getElementById("dlGo");
  var statusEl = document.getElementById("dlStatus");
  var errEl = document.getElementById("dlErr");
  var directEl = document.getElementById("dlDirectNote");
  var dailyEl = document.getElementById("dlDaily");
  var pickerBox = document.getElementById("dlPicker");
  var pickList = document.getElementById("dlPickList");
  var resultBox = document.getElementById("dlResult");
  var fileNameEl = document.getElementById("dlFileName");
  var dlBtn = document.getElementById("dlDlBtn");
  var signinBox = document.getElementById("dlSignin");
  var dlBox = document.getElementById("dlBox");
  var fmtMp4 = document.getElementById("dlFmtMp4");
  var fmtMp3 = document.getElementById("dlFmtMp3");
  var qualityWrap = document.getElementById("dlQualityWrap");
  var qualityRow = document.getElementById("dlQualityRow");

  var curFormat = "mp4";
  var curQuality = "1080";
  var busy = false;
  var statusTimer = null;
  var statusSecs = 0;
  var resultUrl = "";
  var resultName = "";

  function renderPlatLine(){
    var u = urlInput.value.trim();
    platEl.textContent = u ? t(platKey(detectPlatform(u))) : "";
  }
  function setErr(msg){ errEl.textContent = msg || ""; }
  function setStatus(msg){ statusEl.textContent = msg || ""; }
  function startTicker(){
    stopTicker();
    statusSecs = 0;
    setStatus(t("dlWorking") + " 0s");
    statusTimer = setInterval(function(){
      statusSecs++;
      setStatus(t("dlWorking") + " " + statusSecs + "s");
    }, 1000);
  }
  function stopTicker(){ if (statusTimer) { clearInterval(statusTimer); statusTimer = null; } }
  function showDaily(j){
    if (j && j.daily && typeof j.daily.left === "number") {
      dailyEl.textContent = t("dlLeft") + " " + j.daily.left + " / 20";
    }
  }
  function syncDlAuth(){
    var em = curEmail();
    signinBox.hidden = !!em;
    dlBox.hidden = !em;
    goBtn.disabled = !em;
  }
  function setFormat(f){
    curFormat = f;
    fmtMp4.classList.toggle("on", f === "mp4");
    fmtMp3.classList.toggle("on", f === "mp3");
    fmtMp4.setAttribute("aria-pressed", f === "mp4" ? "true" : "false");
    fmtMp3.setAttribute("aria-pressed", f === "mp3" ? "true" : "false");
    qualityWrap.hidden = (f !== "mp4");
  }
  function setQuality(q){
    curQuality = q;
    var bs = qualityRow.querySelectorAll("button[data-q]");
    for (var i = 0; i < bs.length; i++) {
      var on = bs[i].getAttribute("data-q") === q;
      bs[i].classList.toggle("on", on);
      bs[i].setAttribute("aria-pressed", on ? "true" : "false");
    }
  }
  function fileNameFor(suggested, format, url){
    var name = String(suggested || "").trim();
    if (name && name.indexOf("/") === -1 && name.indexOf("\\") === -1) return name;
    var ext = format === "mp3" ? "mp3" : "mp4";
    var m = String(url || "").match(/\.(mp4|mp3|webm|m4a)(?:[?#]|$)/i);
    if (m) ext = m[1].toLowerCase();
    return "MovAi-" + Date.now().toString(36) + "." + ext;
  }
  function showResult(url, filename, format){
    stopTicker();
    setStatus(t("dlReady"));
    /* Keep the phone-direct note visible when the file came through the
       fallback, so the user sees it was downloaded from their phone. */
    pickerBox.hidden = true;
    resultUrl = url;
    resultName = fileNameFor(filename, format, url);
    fileNameEl.textContent = resultName;
    dlBtn.disabled = false;
    dlBtn.textContent = t("dlSaveFile");
    resultBox.hidden = false;
  }
  function renderPicker(items, audioUrl, format){
    stopTicker();
    setStatus("");
    resultBox.hidden = true;
    pickList.innerHTML = "";
    var list = [];
    if (format === "mp3" && audioUrl) list.push({ type: "audio", url: audioUrl });
    for (var i = 0; i < items.length; i++) {
      if (items[i] && items[i].url) list.push(items[i]);
    }
    list.forEach(function(it, idx){
      var isAudio = it.type === "audio";
      var b = document.createElement("button");
      b.type = "button";
      b.className = "dl-pick-item";
      var kind = document.createElement("span");
      kind.className = "dl-pick-kind";
      kind.textContent = isAudio ? "MP3" : "MP4";
      var lbl = document.createElement("span");
      lbl.textContent = (isAudio ? t("dlPickAudio") : t("dlPickVideo")) + " " + (idx + 1);
      b.appendChild(kind);
      b.appendChild(lbl);
      b.addEventListener("click", function(){
        showResult(it.url, "", isAudio ? "mp3" : "mp4");
      });
      pickList.appendChild(b);
    });
    pickerBox.hidden = false;
  }
  /* MP4 picker where the audio is separate: the video choices would be
     mute, so never offer them — show the no-audio notice and offer MP3. */
  function showNoAudio(){
    stopTicker();
    setStatus("");
    setErr(t("dlNoAudio"));
    pickList.innerHTML = "";
    var b = document.createElement("button");
    b.type = "button";
    b.className = "dl-pick-item";
    var kind = document.createElement("span");
    kind.className = "dl-pick-kind";
    kind.textContent = "MP3";
    var lbl = document.createElement("span");
    lbl.textContent = t("dlNoAudioMp3");
    b.appendChild(kind);
    b.appendChild(lbl);
    b.addEventListener("click", function(){
      pickerBox.hidden = true;
      setFormat("mp3");
      runResolve();
    });
    pickList.appendChild(b);
    pickerBox.hidden = false;
  }
  function handleServerResult(j, url, format){
    if (!j) { setErr(t("dlFailed")); return; }
    if (j.needLogin) { setErr(t("dlNeedSignIn")); syncDlAuth(); return; }
    if (!j.ok) {
      if (j.code === "youtube_blocked") { runPhoneDirect(url, format); return; }
      setErr(j.error ? cleanErr(j.error) : t("dlFailed"));
      return;
    }
    showDaily(j);
    if ((j.kind === "tunnel" || j.kind === "redirect") && j.url) {
      showResult(j.url, j.filename || "", format);
      return;
    }
    if (j.kind === "picker" && Array.isArray(j.picker) && j.picker.length) {
      if (format === "mp4" && j.audio) { showNoAudio(); return; }
      renderPicker(j.picker, j.audio || "", format);
      return;
    }
    if (j.kind === "local-processing") { setErr(t("dlLocalProc")); return; }
    setErr(t("dlFailed"));
  }
  function runResolve(){
    if (busy) return;
    var email = curEmail();
    if (!email) { setErr(t("dlNeedSignIn")); syncDlAuth(); return; }
    var url = urlInput.value.trim();
    if (!url) { setErr(t("dlNeedUrl")); urlInput.focus(); return; }
    if (!/^https?:\/\//i.test(url)) { setErr(t("dlBadUrl")); return; }
    busy = true;
    goBtn.disabled = true;
    setErr("");
    directEl.textContent = "";
    pickerBox.hidden = true;
    resultBox.hidden = true;
    dailyEl.textContent = "";
    startTicker();
    apiPost("/api/download/resolve", { email: email, url: url, format: curFormat, quality: curQuality }, 150000).then(function(j){
      busy = false;
      goBtn.disabled = false;
      stopTicker();
      setStatus("");
      handleServerResult(j, url, curFormat);
    }).catch(function(){
      busy = false;
      goBtn.disabled = false;
      stopTicker();
      setStatus("");
      setErr(t("dlNoServer"));
    });
  }
  /* ---- phone-direct fallback (same proven flow as the chat downloader):
     the request goes straight from this phone to the download service —
     Turnstile token minted in this browser, session JWT, then POST. ---- */
  function directInstanceFor(url){
    var u = String(url || "").toLowerCase();
    if (u.indexOf("youtube.com") >= 0 || u.indexOf("youtu.be") >= 0) return "https://cobalt-api.meowing.de/";
    return "https://api.cobalt.tools/";
  }
  function getTurnstileToken(sitekey){
    return new Promise(function(resolve){
      var done = false, timer = null;
      function res(v){ if (!done) { done = true; if (timer) clearTimeout(timer); resolve(v); } }
      if (!window.turnstile) { res(""); return; }
      var box = document.getElementById("tsBox");
      if (!box) { res(""); return; }
      try {
        var wid = window.turnstile.render(box, { sitekey: sitekey, size: "invisible",
          callback: function(tok){ try { window.turnstile.remove(wid); } catch (e) {} res(tok || ""); },
          "error-callback": function(){ res(""); },
          "expired-callback": function(){ res(""); } });
        window.turnstile.execute(wid);
      } catch (e) { res(""); return; }
      timer = setTimeout(function(){ res(""); }, 60000);
    });
  }
  function runPhoneDirect(url, format){
    busy = true;
    goBtn.disabled = true;
    directEl.textContent = t("dlDirectNote");
    setStatus(t("dlTurnstile"));
    startTicker();
    var inst = directInstanceFor(url);
    function fail(msg){
      stopTicker();
      setStatus("");
      directEl.textContent = "";
      setErr(msg || t("dlFailed"));
      busy = false;
      goBtn.disabled = false;
    }
    fetch(inst, { method: "GET" }).then(function(r){ return r.json(); }).then(function(info){
      var sitekey = info && info.cobalt && info.cobalt.turnstileSitekey;
      if (!sitekey) { fail(t("dlFailed")); return; }
      getTurnstileToken(sitekey).then(function(tok){
        if (!tok) { fail(t("dlFailed")); return; }
        fetch(inst + "session", { method: "POST", headers: { "cf-turnstile-response": tok } }).then(function(r){ return r.json(); }).then(function(s){
          var jwt = s && s.token;
          if (!jwt) { fail((s && s.error && cleanErr(s.error.message || s.error.code)) || t("dlFailed")); return; }
          var body = { url: url, downloadMode: format === "mp3" ? "audio" : "auto", filenameStyle: "basic" };
          if (format === "mp3") body.audioFormat = "mp3";
          else { body.videoQuality = curQuality; body.youtubeVideoContainer = "mp4"; }
          var ctrl = null;
          var opts = { method: "POST", headers: { "Accept": "application/json", "Content-Type": "application/json", "Authorization": "Bearer " + jwt }, body: JSON.stringify(body) };
          if (window.AbortController) {
            ctrl = new AbortController();
            opts.signal = ctrl.signal;
            setTimeout(function(){ try { ctrl.abort(); } catch (e) {} }, 120000);
          }
          fetch(inst, opts).then(function(r){ return r.json(); }).then(function(j){
            stopTicker();
            setStatus("");
            busy = false;
            goBtn.disabled = false;
            if (j && (j.status === "redirect" || j.status === "tunnel") && j.url) {
              showResult(j.url, j.filename || "", format);
              return;
            }
            if (j && j.status === "picker" && Array.isArray(j.picker) && j.picker.length) {
              if (format === "mp4" && j.audio) { showNoAudio(); return; }
              renderPicker(j.picker, j.audio || "", format);
              return;
            }
            if (j && j.status === "local-processing") { setErr(t("dlLocalProc")); return; }
            fail((j && j.error && cleanErr(j.error.message || j.error.code)) || t("dlFailed"));
          }).catch(function(){ fail(t("dlNoServer")); });
        }).catch(function(){ fail(t("dlNoServer")); });
      });
    }).catch(function(){ fail(t("dlNoServer")); });
  }
  /* ---- blob download: Chrome ignores the download attribute on
     cross-origin links, so fetch as a blob and save it locally. ---- */
  function blobDownload(url, filename, btn){
    btn.disabled = true;
    btn.textContent = t("dlDownloadingFile");
    fetch(url, { mode: "cors" }).then(function(r){
      if (!r.ok) throw new Error("http " + r.status);
      return r.blob();
    }).then(function(blob){
      var objUrl = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = objUrl;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function(){ try { URL.revokeObjectURL(objUrl); } catch (e) {} }, 5000);
      setStatus(t("dlDownloaded"));
      btn.disabled = false;
      btn.textContent = t("dlSaveFile");
    }).catch(function(){
      btn.disabled = false;
      btn.textContent = t("dlSaveFile");
      setErr(t("dlFailed"));
      try { window.open(url, "_blank"); } catch (e) {}
    });
  }

  urlInput.addEventListener("input", renderPlatLine);
  urlInput.addEventListener("change", renderPlatLine);
  pasteBtn.addEventListener("click", function(){
    if (navigator.clipboard && navigator.clipboard.readText) {
      navigator.clipboard.readText().then(function(txt){
        if (txt) { urlInput.value = String(txt).trim(); renderPlatLine(); }
      }).catch(function(){
        setErr(t("dlPasteFail"));
        urlInput.focus();
      });
    } else {
      urlInput.focus();
      setErr(t("dlPasteFail"));
    }
  });
  fmtMp4.addEventListener("click", function(){ setFormat("mp4"); });
  fmtMp3.addEventListener("click", function(){ setFormat("mp3"); });
  qualityRow.addEventListener("click", function(e){
    var b = e.target && e.target.closest ? e.target.closest("button[data-q]") : null;
    if (b) setQuality(b.getAttribute("data-q"));
  });
  goBtn.addEventListener("click", runResolve);
  dlBtn.addEventListener("click", function(){
    if (!resultUrl) return;
    blobDownload(resultUrl, resultName, dlBtn);
  });

  syncDlAuth();
  applyLang();
})();
</script>
<script>
(function(){
  "use strict";
  /* ---- Chat button: slides in from the right edge on app open (blurry to
     clear); if untouched for 10s it fades back to blurry, slides out to the
     right and disappears completely; it returns on the next app open. ---- */
  var fab = document.getElementById("chatFab");
  if (!fab) return;
  var HIDE_MS = 10000;
  var hideTimer = null;
  function openChat(){
    if (window.location.pathname && window.location.pathname.indexOf("movai-new-chat.html") !== -1) {
      var inp = document.getElementById("chatInput");
      if (inp) { inp.focus(); }
      window.scrollTo(0, document.body.scrollHeight);
      return;
    }
    window.location.href = "movai-new-chat.html";
  }
  function hideFab(){
    fab.classList.remove("in");
    fab.classList.add("out");
    setTimeout(function(){ fab.style.display = "none"; }, 500);
  }
  function cancelHide(){ if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; } }
  fab.addEventListener("pointerdown", cancelHide);
  fab.addEventListener("mouseenter", cancelHide);
  fab.addEventListener("touchstart", cancelHide, { passive: true });
  fab.addEventListener("focus", cancelHide);
  fab.addEventListener("click", function(e){ e.preventDefault(); cancelHide(); openChat(); });
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      fab.classList.add("in");
      hideTimer = setTimeout(hideFab, HIDE_MS);
    });
  });
})();
</script>
</body>
