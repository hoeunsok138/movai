  function fileNameFor(suggested, format, url){
    var ext = format === "mp3" ? "mp3" : "mp4";
    /* Titles have no extension — sanitize and add one, so the saved
       file is "Title.mp4" / "Title.mp3", never extension-less. */
    var name = String(suggested || "").trim().replace(/[\\/:*?"<>|]/g, "").replace(/\s+/g, " ").trim();
    if (name) {
      if (!/\.(mp4|mp3|webm|m4a)$/i.test(name)) name += "." + ext;
      return name.slice(0, 120);
    }
    var m = String(url || "").match(/\.(mp4|mp3|webm|m4a)(?:[?#]|$)/i);
    if (m) ext = m[1].toLowerCase();
    return "MovAi-" + Date.now().toString(36) + "." + ext;
  }

  /* ---- polling: every 5s, live ticking seconds + the real status.
     A poll that fails once never kills the job — the next tick retries.
     After 10 minutes the job is given up on (timeout). ---- */
  function stopPoll(){ if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }
  function pollStatus(){
    stopPoll();
    pollSecs = 0;
    var jobId = currentJobId;
    function tick(){
      pollSecs++;
      if (pollSecs >= 600) {
        stopPoll();
        currentJobId = "";
        busy = false;
        goBtn.disabled = false;
        downloadBtn.disabled = false;
        setStatus("");
        setErr(t("dlTimeout"));
        return;
      }
      setStatus((currentStatusText || t("dlWorking")) + " " + pollSecs + "s");
    }
    function checkOnce(){
      if (!currentJobId || currentJobId !== jobId) return;
      apiPost("/api/download/vidfetch/status", { email: curEmail(), jobId: jobId }, 40000).then(function(j){
        if (!j || !currentJobId || currentJobId !== jobId) return;
        if (!j.ok) {
          stopPoll();
          busy = false;
          goBtn.disabled = false;
          downloadBtn.disabled = false;
          setStatus("");
          if (j.needLogin) { setErr(t("dlNeedSignIn")); syncDlAuth(); }
          else setErr(cleanErr(j.error));
          return;
        }
        if (j.status === "completed" && j.download_url) {
          stopPoll();
          busy = false;
          goBtn.disabled = false;
          setStatus(t("dlReady"));
          currentStatusText = "";
          blobDownload(j.download_url, fileNameFor(titleKnown ? titleEl.textContent : "", "mp3", currentUrl), downloadBtn, "dlDownload");
          return;
        }
        if (j.status === "failed" || j.status === "deleted" || j.status === "cancelled") {
          stopPoll();
          busy = false;
          goBtn.disabled = false;
          downloadBtn.disabled = false;
          setStatus("");
          setErr(cleanErr(j.error));
          return;
        }
        currentStatusText = j.status === "queued" ? t("dlQueued") : t("dlProcessing");
        var pct = (typeof j.progress === "number" && j.progress > 0) ? " • " + Math.floor(j.progress) + "%" : "";
        setStatus(currentStatusText + pct + " " + pollSecs + "s");
      }).catch(function(){
        /* one failed poll never kills the job — the next tick retries */
      });
    }
    pollTimer = setInterval(function(){
      tick();
      checkOnce();
    }, 5000);
    tick();
    checkOnce();
  }

  /* START: paste link → tap START → info → preview panel + rows with
     REAL sizes. No wake-up, no phone-direct fallback, no bot-check —
     the API is always awake. */
  function runStart(){

    if (!email) { setErr(t("dlNeedSignIn")); syncDlAuth(); return; }
    var url = urlInput.value.trim();
    if (!url) { setErr(t("dlNeedUrl")); urlInput.focus(); return; }
    if (!/^https?:\/\//i.test(url)) { setErr(t("dlBadUrl")); return; }
    currentUrl = url;
    busy = true;
    goBtn.disabled = true;
    setErr("");
    hidePreview();
    previewBox.hidden = false;

      stopTicker();
      setStatus("");
      busy = false;
      goBtn.disabled = false;
      if (!j) { hidePreview(); setErr(t("dlNoServer")); return; }
      if (j.needLogin) { hidePreview(); setErr(t("dlNeedSignIn")); syncDlAuth(); return; }
      if (!j.ok) { hidePreview(); setErr(cleanErr(j.error)); return; }
      infoFormats = Array.isArray(j.formats) ? j.formats : [];
      setPreviewShell(url, j);
      if (!infoFormats.length) { setErr(t("dlNoFormats")); return; }

  /* Download: create the job, then poll until it is ready. */
  function runDownload(){
    if (busy) return;
    var email = curEmail();
    if (!email) { setErr(t("dlNeedSignIn")); syncDlAuth(); return; }
    if (!selectedRow || !currentUrl) return;
    busy = true;

    setErr("");
    setStatus(t("dlWorking") + " 0s");
    var format = "mp3";

    apiPost("/api/download/vidfetch/create", { email: email, url: currentUrl, format: format, quality: quality }, 60000).then(function(j){
      if (!j) { busy = false; downloadBtn.disabled = false; setStatus(""); setErr(t("dlNoServer")); return; }
      if (j.needLogin) { busy = false; downloadBtn.disabled = false; setStatus(""); setErr(t("dlNeedSignIn")); syncDlAuth(); return; }
      if (!j.ok) {
        busy = false;
        downloadBtn.disabled = false;
        setStatus("");
        setErr(cleanErr(j.error));
        return;
      }
      currentJobId = j.jobId || "";
      if (!currentJobId) { busy = false; downloadBtn.disabled = false; setStatus(""); setErr(t("dlFailed")); return; }

  /* ---- in-app download: the VidFetch storage host sends no CORS
     headers, so fetching its URL directly always fails ("Download
     failed") — fetch it through our own server's proxy endpoint
     (/api/gen/video/file) instead, which returns the same bytes with
     Content-Disposition: attachment. Never open the storage URL in a
     new tab. ---- */
  function blobDownload(url, filename, btn, labelKey){
    btn.disabled = true;
    btn.textContent = t("dlDownloadingFile");
    var fileUrl = API_BASE + "/api/gen/video/file?u=" + encodeURIComponent(url) + "&name=" + encodeURIComponent(filename);
    fetch(fileUrl).then(function(r){
      if (!r.ok) throw new Error("http " + r.status);
      return r.blob();
    }).then(function(blob){
      var objUrl = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = objUrl;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      try { dlRecordDownload({ title: filename, url: url, size: blob.size, at: Date.now() }); } catch (e) {}
      setTimeout(function(){ try { URL.revokeObjectURL(objUrl); } catch (e) {} }, 5000);
      setStatus(t("dlDownloaded"));
      btn.disabled = false;
      btn.textContent = t(labelKey || "dlSaveFile");
      refreshUsage();
    }).catch(function(){
      btn.disabled = false;
      btn.textContent = t(labelKey || "dlSaveFile");
      setErr(t("dlFailed"));
    });
  }

  /* ---- Downloaded songs: floating blue-arrow button (bottom-right,
      above the chat button) + bottom sheet. Every completed download
      is recorded in localStorage (movai-downloads) so the list survives
      reloads and shows the songs saved to the phone. The button only
      appears when there is at least one downloaded song; when it
      appears, the chat button pops up with it (it does not auto-hide). ---- */
  var DL_STORE_KEY = "movai-downloads";
  var DL_STORE_MAX = 100;
  function dlLoadDownloads(){ try { var raw = localStorage.getItem(DL_STORE_KEY); var arr = raw ? JSON.parse(raw) : []; return Array.isArray(arr) ? arr : []; } catch (e) { return []; } }
  function dlSaveDownloads(arr){ try { localStorage.setItem(DL_STORE_KEY, JSON.stringify(arr.slice(0, DL_STORE_MAX))); } catch (e) {} }
  function dlRecordDownload(item){ if (!item || !item.url) return; var arr = dlLoadDownloads(); arr = arr.filter(function(x){ return x.url !== item.url; }); arr.unshift({ title: item.title || "MP3", url: item.url, size: item.size || 0, at: item.at || Date.now() }); dlSaveDownloads(arr); dlRenderFab(); }
  function dlRemoveDownload(url){ dlSaveDownloads(dlLoadDownloads().filter(function(x){ return x.url !== url; })); dlRenderFab(); dlRenderList(); }
  function dlFmtSize(b){ if (!b || b <= 0) return ""; if (b >= 1048576) return (b / 1048576).toFixed(1) + " MB"; return Math.max(1, Math.round(b / 1024)) + " KB"; }
  function dlFmtDate(ts){ try { var d = new Date(ts); return (d.getMonth() + 1) + "/" + d.getDate(); } catch (e) { return ""; } }
  function dlRenderFab(){ var fab = document.getElementById("dlFab"); var cnt = document.getElementById("dlFabCount"); if (!fab) return; var arr = dlLoadDownloads(); if (arr.length > 0) { fab.classList.add("show"); if (cnt) cnt.textContent = String(arr.length); if (window.movaiShowChatFab) { try { window.movaiShowChatFab(); } catch (e) {} } } else { fab.classList.remove("show"); } }
  function dlRenderList(){ var list = document.getElementById("dlList"); if (!list) return; var arr = dlLoadDownloads(); var title = document.getElementById("dlSheetTitle"); if (title) title.textContent = t("dlDlTitle") + (arr.length ? " · " + arr.length : ""); if (!arr.length) { list.innerHTML = '<div class="dl-empty">' + t("dlDlEmpty") + '</div>'; return; } list.innerHTML = ""; arr.forEach(function(it){ var row = document.createElement("div"); row.className = "dl-row"; var info = document.createElement("div"); info.className = "dl-row-info"; var ti = document.createElement("div"); ti.className = "dl-row-title"; ti.textContent = (it.title || "MP3").replace(/\.mp3$/i, ""); var me = document.createElement("div"); me.className = "dl-row-meta"; me.textContent = [dlFmtSize(it.size), dlFmtDate(it.at)].filter(Boolean).join(" · "); info.appendChild(ti); info.appendChild(me); var again = document.createElement("button"); again.type = "button"; again.className = "dl-row-btn"; again.textContent = t("dlDlAgain"); again.addEventListener("click", function(){ blobDownload(it.url, it.title || "song.mp3", again, "dlDownload"); }); var del = document.createElement("button"); del.type = "button"; del.className = "dl-row-del"; del.textContent = "✕"; del.setAttribute("aria-label", t("dlDlDel")); del.addEventListener("click", function(){ dlRemoveDownload(it.url); }); row.appendChild(info); row.appendChild(again); row.appendChild(del); list.appendChild(row); }); }
  function dlSetSheet(open){ var veil = document.getElementById("dlVeil"); var sheet = document.getElementById("dlSheet"); if (!veil || !sheet) return; if (open) { dlRenderList(); veil.classList.add("open"); sheet.classList.add("open"); } else { veil.classList.remove("open"); sheet.classList.remove("open"); } }
  (function dlWire(){ var fab = document.getElementById("dlFab"); if (fab) fab.addEventListener("click", function(){ dlSetSheet(true); }); var close = document.getElementById("dlSheetClose"); if (close) close.addEventListener("click", function(){ dlSetSheet(false); }); var veil = document.getElementById("dlVeil"); if (veil) veil.addEventListener("click", function(){ dlSetSheet(false); }); dlRenderFab(); })();
  syncDlAuth();
  applyLang();
})();
</script>
<script>
(function(){
  "use strict";
  /* ---- Chat button: slides in from the right edge on app open (blurry to
     clear); if untouched for 10s it fades back to blurry, slides out to the
     right and disappears completely; it returns on the next app open. ---- */
  var fab = document.getElementById("chatFab");
  if (!fab) return;
  var HIDE_MS = 10000;
  var hideTimer = null;
  function openChat(){
    if (window.location.pathname && window.location.pathname.indexOf("movai-new-chat.html") !== -1) {
      var inp = document.getElementById("chatInput");
      if (inp) { inp.focus(); }
      window.scrollTo(0, document.body.scrollHeight);
      return;
    }
    window.location.href = "movai-new-chat.html";
  }
  function hideFab(){
    fab.classList.remove("in");
    fab.classList.add("out");
    setTimeout(function(){ fab.style.display = "none"; }, 500);
  }
  function cancelHide(){ if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; } }
  window.movaiShowChatFab = function(){ cancelHide(); fab.classList.remove("out"); fab.classList.add("in"); fab.style.display = ""; };
  fab.addEventListener("pointerdown", cancelHide);
  fab.addEventListener("mouseenter", cancelHide);
  fab.addEventListener("touchstart", cancelHide, { passive: true });
  fab.addEventListener("focus", cancelHide);
  fab.addEventListener("click", function(e){ e.preventDefault(); cancelHide(); openChat(); });
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      fab.classList.add("in");
      hideTimer = setTimeout(hideFab, HIDE_MS);
    });
  });
})();
</script>
