<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<link rel="icon" type="image/png" sizes="512x512" href="movai-icon-512.png">

<title>MovAi Music Generate Kh — Download Center</title>
<script>try{var _mt=localStorage.getItem("movai-theme")||"auto";var _md=_mt==="auto"?window.matchMedia("(prefers-color-scheme: dark)").matches:_mt==="night";document.documentElement.setAttribute("data-theme",_md?"dark":"light");}catch(e){document.documentElement.setAttribute("data-theme","light")}</script>
<style>
  /* MovAi new — clean look, one single pale background, no layers. */
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;overflow-x:hidden}
  html{
    background:linear-gradient(180deg,#e8f5f0 0%,#f2faf6 45%,#ffffff 100%);
    background-attachment:fixed;
    -webkit-text-size-adjust:100%;
  }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    color:#1f2937;
    background:linear-gradient(180deg,#e8f5f0 0%,#f2faf6 45%,#ffffff 100%);
    background-attachment:fixed;
    min-height:100vh;
  }
  a{color:#1f2937;text-decoration:none}
  button{font:inherit;color:inherit;background:transparent;border:0;padding:0;cursor:pointer}
  img{display:block;max-width:100%}

  .wrap{max-width:720px;margin:0 auto}

  /* ---- Header: two rows, directly on the background (transparent) ---- */
  header{position:fixed;top:0;left:0;right:0;z-index:50;max-width:720px;margin:auto;
    background:linear-gradient(180deg,#e8f5f0 0%,#f2faf6 45%,#ffffff 100%);
    background-attachment:fixed;}
  .hdr-row{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding-left:16px;padding-right:16px}
  .hdr-top{padding-top:14px;padding-bottom:10px;border-bottom:1px solid #e5e7eb}
  .hdr-sub{padding-top:11px;padding-bottom:11px;border-bottom:1px solid #e5e7eb}
  .hdr-logo{display:flex;align-items:center;gap:8px;color:#1f2937;min-width:0}
  .hdr-logo svg,.hdr-logo img{flex:none}
  .hdr-logo b{font-size:1.3rem;font-weight:800;letter-spacing:-.02em;line-height:1;background:linear-gradient(90deg,#ff2d78,#ff7a18);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hdr-right{display:flex;align-items:center;gap:4px}
  .icon-btn{font-size:1.35rem;line-height:1;color:#1f2937;padding:4px 9px;border-radius:8px}
  .icon-btn:active{background:#e5e7eb}
  .hdr-sec{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
  .hdr-sec .icon-btn{padding:4px 8px}
  .hdr-sec-name{font-size:1rem;font-weight:600;color:#1f2937;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hdr-btn{flex:none;font-size:.9rem;font-weight:600;color:#1f2937;
    border:1px solid #d1d5db;border-radius:8px;padding:6px 12px;background:transparent}
  .hdr-btn:active{background:#e5e7eb}

  /* ---- Bottom menu: fixed bottom-left button, bottom sheet (never rises to the top) ---- */
  .menu-fab{position:fixed;left:16px;bottom:16px;z-index:60;
    width:52px;height:52px;border-radius:50%;
    background:#f2faf6;border:1px solid #d1d5db;
    font-size:1.4rem;line-height:1;color:#1f2937;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 10px rgba(0,0,0,.12);transition:opacity .25s ease}
  .menu-fab:active{background:#e5e7eb}
  .menu-veil{position:fixed;inset:0;z-index:55;display:none;
    background:rgba(242,250,246,.55);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
  .menu-veil.open{display:block;animation:veilIn .18s ease-out}
  @keyframes veilIn{from{opacity:0}to{opacity:1}}
  .menu{position:fixed;left:0;right:0;bottom:0;z-index:56;
    max-height:70vh;overflow-y:auto;
    background:#f2faf6;border-top:1px solid #e5e7eb;border-radius:16px 16px 0 0;
    padding:6px 0 calc(10px + env(safe-area-inset-bottom,0px));
    transform:translateY(105%);transition:transform .22s ease-out;
    visibility:hidden}
  .menu.open{transform:translateY(0);visibility:visible;animation:sheetIn .25s ease-out}
  @keyframes sheetIn{from{filter:blur(6px)}to{filter:blur(0)}}
  .menu.open + .menu-fab{display:none}
  .menu a,.menu button.menu-link{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    padding:13px 20px;font-size:.95rem;color:#1f2937;border-bottom:1px solid #eef1f0;background:transparent}
  .menu a .nav-ic{display:inline-flex;flex:none;line-height:0}
  .menu a .nav-ic svg{display:block;width:20px;height:20px}
  .menu a:last-child,.menu button.menu-link:last-child{border-bottom:0}
  .menu a:active,.menu button.menu-link:active{background:#e5e7eb}
  .menu .menu-sep{height:1px;background:#e5e7eb;margin:6px 0}
  .menu .menu-user{padding:12px 20px 4px;font-size:.85rem;color:#6b7280}
  [hidden]{display:none !important}

  main{padding-top:108px;padding-bottom:120px}

  /* ---- Download Center: plain rows directly on the background ---- */
  .dl-sec{padding:16px}
  .dl-urlrow{display:flex;gap:8px;align-items:stretch}
  .dl-input{flex:1;min-width:0;font:inherit;font-size:.95rem;color:#1f2937;
    background:#ffffff;border:1px solid #d1d5db;border-radius:10px;padding:12px 12px}
  .dl-input:focus{outline:2px solid #0f766e;border-color:#0f766e}
  .dl-paste{flex:none;font-size:.9rem;font-weight:700;color:#ffffff;background:#0f766e;
    border-radius:10px;padding:12px 16px}
  .dl-paste:active{opacity:.85}
  .dl-platrow{display:flex;align-items:center;gap:8px;margin-top:8px;min-height:28px}
  .dl-platlogo{flex:none;width:28px;height:28px;background:#ffffff;border:1px solid #e5e7eb;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;overflow:hidden}
  .dl-platlogo svg{width:20px;height:20px}
  .dl-plat{font-size:.85rem;font-weight:700;color:#0f766e}
  .dl-lbl{margin-top:16px;font-size:.85rem;font-weight:700;color:#6b7280}
  .dl-chips{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
  .dl-chip{font-size:.92rem;font-weight:700;color:#1f2937;background:#ffffff;
    border:1px solid #d1d5db;border-radius:999px;padding:9px 16px}
  .dl-chip:active{background:#e5e7eb}
  .dl-chip.on{background:#0f766e;border-color:#0f766e;color:#ffffff}
  .dl-go{display:block;width:100%;margin-top:20px;font-size:1rem;font-weight:800;color:#ffffff;
    background:linear-gradient(90deg,#ff2d78,#ff7a18);border-radius:10px;padding:14px 16px}
  .dl-go:active{opacity:.85}
  .dl-go:disabled{opacity:.55}
  .dl-free{margin-top:10px;font-size:.82rem;color:#6b7280;text-align:center}
  .dl-status{margin-top:14px;font-size:.92rem;font-weight:600;color:#1f2937;min-height:20px;font-variant-numeric:tabular-nums}
  .dl-status:empty{display:none}
  .dl-err{margin-top:10px;font-size:.92rem;font-weight:600;color:#991b1b;line-height:1.5;word-break:break-word}
  .dl-err:empty{display:none}
  .dl-note{margin-top:10px;font-size:.85rem;color:#6b7280;line-height:1.5}
  .dl-note:empty{display:none}
  .dl-daily{margin-top:10px;font-size:.85rem;color:#6b7280;text-align:center}
  .dl-daily:empty{display:none}
  .dl-preview{margin-top:16px;border:1px solid #d1d5db;border-radius:12px;padding:12px;background:#ffffff}
  .dl-prevtop{display:flex;gap:10px;align-items:flex-start}
  .dl-thumb{flex:none;width:112px;height:63px;border-radius:8px;overflow:hidden;background:#e5e7eb;display:flex;align-items:center;justify-content:center}
  .dl-thumb img{width:100%;height:100%;object-fit:cover}
  .dl-thumb svg{width:28px;height:28px;color:#9ca3af}
  .dl-prevmeta{flex:1;min-width:0}
  .dl-title{font-size:.92rem;font-weight:700;color:#1f2937;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
  .dl-source{margin-top:4px;font-size:.8rem;color:#6b7280;word-break:break-all}
  .dl-rows{margin-top:12px}
  .dl-row{display:flex;width:100%;align-items:center;gap:8px;text-align:left;
    padding:12px 14px;font-size:.92rem;font-weight:600;color:#1f2937;background:#ffffff;
    border:1px solid #d1d5db;border-radius:10px;margin-bottom:8px}
  .dl-row:active{background:#eef7f4}
  .dl-row:disabled{opacity:.55}
  .dl-row.sel{border-color:#0f766e;background:#eef7f4}
  .dl-row-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dl-row-check{flex:none;width:20px;text-align:center;color:#0f766e;visibility:hidden}
  .dl-row.sel .dl-row-check{visibility:visible}
  .dl-row-size{flex:none;font-size:.82rem;font-weight:700;color:#6b7280;font-variant-numeric:tabular-nums}
  .dl-more{display:block;width:100%;margin-top:2px;font-size:.9rem;font-weight:700;color:#0f766e;background:transparent;border:1px dashed #9ca3af;border-radius:10px;padding:11px 14px}
  .dl-more:active{background:#eef7f4}
  .dl-bigdl{display:block;width:100%;margin-top:12px;font-size:1rem;font-weight:800;color:#ffffff;
    background:linear-gradient(90deg,#ff2d78,#ff7a18);border-radius:10px;padding:14px 16px}
  .dl-bigdl:active{opacity:.85}
  .dl-bigdl:disabled{opacity:.55}
  .dl-signin{padding:28px 16px;text-align:center;color:#6b7280;font-size:.95rem;line-height:1.6}
  .dl-signin a{color:#0f766e;font-weight:700;text-decoration:underline}
  /* ---- Drawer settings: theme + language ---- */
  .menu-set{padding:12px 20px 6px}
  .menu-set-label{font-size:.85rem;font-weight:700;color:#6b7280;margin-bottom:8px}
  .seg-mini{display:flex;gap:6px}
  .seg-mini button{flex:1;font-size:.88rem;font-weight:600;color:#1f2937;
    border:1px solid #d1d5db;border-radius:8px;padding:8px 6px;background:transparent}
  .seg-mini button:active{background:#e5e7eb}
  .seg-mini button.on{background:#0f766e;border-color:#0f766e;color:#ffffff}
  /* ---- Chat button: bottom-right, slides in from the right edge ---- */
  .chat-fab{position:fixed;right:16px;bottom:16px;z-index:60;
    width:52px;height:52px;border-radius:50%;
    background:#0f766e;border:1px solid #0f766e;
    color:#ffffff;display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 10px rgba(0,0,0,.18);
    transform:translateX(calc(100% + 24px));opacity:0;filter:blur(6px);
    transition:transform .45s ease-out,opacity .45s ease-out,filter .45s ease-out;
    pointer-events:none}
  .chat-fab.in{transform:translateX(0);opacity:1;filter:blur(0);pointer-events:auto}
  .chat-fab.out{transform:translateX(calc(100% + 24px));opacity:0;filter:blur(6px);pointer-events:none}
  .chat-fab:active{opacity:.85}
  body.drawer-open .chat-fab{transform:translateX(calc(100% + 24px)) !important;opacity:0 !important;filter:blur(6px) !important;pointer-events:none !important}
  body.scrolling .menu-fab,body.scrolling .chat-fab{opacity:0 !important;pointer-events:none !important}
  .chat-fab svg{width:24px;height:24px;flex:none}
  html[data-theme="dark"] .chat-fab{background:#0f766e;border-color:#0f766e;color:#ffffff;box-shadow:0 2px 10px rgba(0,0,0,.5)}
  /* ---- Night theme: same layout, pure black ---- */
  html[data-theme="dark"]{background:#000000}
  html[data-theme="dark"] body{background:#000000;color:#e7f0ec}
  html[data-theme="dark"] a{color:#e7f0ec}
  html[data-theme="dark"] header{background:#000000}
  html[data-theme="dark"] .hdr-top,html[data-theme="dark"] .hdr-sub{border-bottom-color:#262626}
  html[data-theme="dark"] .hdr-sec-name,html[data-theme="dark"] .icon-btn{color:#e7f0ec}
  html[data-theme="dark"] .hdr-logo b{background:linear-gradient(90deg,#ff2d78,#ff7a18);-webkit-background-clip:text;background-clip:text;color:transparent}
  html[data-theme="dark"] .icon-btn:active{background:#1a1a1a}
  html[data-theme="dark"] .hdr-btn{color:#e7f0ec;border-color:#333333}
  html[data-theme="dark"] .hdr-btn:active{background:#1a1a1a}
  html[data-theme="dark"] .menu-fab{background:#000000;border-color:#333333;color:#e7f0ec;box-shadow:0 2px 10px rgba(0,0,0,.5)}
  html[data-theme="dark"] .menu-fab:active{background:#1a1a1a}
  html[data-theme="dark"] .menu-veil{background:rgba(14,26,21,.6)}
  html[data-theme="dark"] .menu{background:#000000;border-top-color:#262626}
  html[data-theme="dark"] .menu a,html[data-theme="dark"] .menu button.menu-link{color:#e7f0ec;border-bottom-color:#262626}
  html[data-theme="dark"] .menu a:active,html[data-theme="dark"] .menu button.menu-link:active{background:#1a1a1a}
  html[data-theme="dark"] .menu .menu-sep{background:#262626}
  html[data-theme="dark"] .menu .menu-user{color:#9ca3af}
  html[data-theme="dark"] .menu-set-label{color:#9ca3af}
  html[data-theme="dark"] .seg-mini button{color:#e7f0ec;border-color:#333333}
  html[data-theme="dark"] .seg-mini button:active{background:#1a1a1a}
  html[data-theme="dark"] .seg-mini button.on{background:#0f766e;border-color:#0f766e;color:#ffffff}
  html[data-theme="dark"] .dl-input{background:#000000;border-color:#333333;color:#e7f0ec}
  html[data-theme="dark"] .dl-input:focus{outline-color:#2dd4bf;border-color:#2dd4bf}
  html[data-theme="dark"] .dl-plat{color:#2dd4bf}
  html[data-theme="dark"] .dl-lbl{color:#9ca3af}
  html[data-theme="dark"] .dl-chip{background:#000000;border-color:#333333;color:#e7f0ec}
  html[data-theme="dark"] .dl-chip:active{background:#1a1a1a}
  html[data-theme="dark"] .dl-chip.on{background:#0f766e;border-color:#0f766e;color:#ffffff}
  html[data-theme="dark"] .dl-free,html[data-theme="dark"] .dl-note,html[data-theme="dark"] .dl-daily{color:#9ca3af}
  html[data-theme="dark"] .dl-status{color:#e7f0ec}
  html[data-theme="dark"] .dl-err{color:#fca5a5}
  html[data-theme="dark"] .dl-preview{background:#1a1a1a;border-color:#333333}
  html[data-theme="dark"] .dl-title{color:#e7f0ec}
  html[data-theme="dark"] .dl-row{background:#000000;border-color:#333333;color:#e7f0ec}
  html[data-theme="dark"] .dl-row:active{background:#1a1a1a}
  html[data-theme="dark"] .dl-row.sel{background:#0f2e2a;border-color:#2dd4bf}
  html[data-theme="dark"] .dl-row-check{color:#2dd4bf}
  html[data-theme="dark"] .dl-more{color:#2dd4bf;border-color:#4b5563}
  html[data-theme="dark"] .dl-more:active{background:#1a1a1a}
  html[data-theme="dark"] .dl-signin{color:#9ca3af}
  html[data-theme="dark"] .dl-signin a{color:#2dd4bf}
  .hdr-back{font-size:1.5rem;font-weight:700;color:inherit;text-decoration:none;padding:0 10px 0 0;line-height:1.2}
</style>
</head>

    if (menuVeil) menuVeil.classList.toggle("open", !!open);
    if (menuFab) menuFab.setAttribute("aria-expanded", open ? "true" : "false");
  }
  function toggleMenu(){ setMenu(!menuEl.classList.contains("open")); }
  if (menuFab) menuFab.addEventListener("click", function(e){ e.stopPropagation(); toggleMenu(); });
  if (menuVeil) menuVeil.addEventListener("click", function(){ setMenu(false); });
  if (menuEl) menuEl.addEventListener("click", function(e){
    var a = e.target && e.target.closest ? e.target.closest("a") : null;
    if (a) setMenu(false);
  });
  document.addEventListener("keydown", function(e){ if (e.key === "Escape") setMenu(false); });
  var scrollFabTimer = null;
  var scrollFabLast = 0;
  window.addEventListener("scroll", function(){
    document.body.classList.add("scrolling");
    scrollFabLast = Date.now();
    if (scrollFabTimer) clearTimeout(scrollFabTimer);
    scrollFabTimer = setTimeout(function(){ document.body.classList.remove("scrolling"); }, 1000);
  }, { passive: true });
  window.addEventListener("scrollend", function(){
    if (scrollFabTimer) clearTimeout(scrollFabTimer);
    document.body.classList.remove("scrolling");
  });
  setInterval(function(){
    if (document.body.classList.contains("scrolling") && Date.now() - scrollFabLast > 1200) document.body.classList.remove("scrolling");
  }, 2000);
  function menuAuthState(){
    var em = "";
    try { em = (localStorage.getItem("movai-session") || "").trim(); } catch (e) { em = ""; }
    if (menuUser) { menuUser.textContent = em ? (t("signedInAs") + em) : ""; menuUser.hidden = !em; }
    if (menuSignIn) menuSignIn.hidden = !!em;
    if (menuSignOut) menuSignOut.hidden = !em;
  }
  function syncDrawerState(){
    try {
      if (typeof applyTheme === "function") applyTheme();
      var ls = null;
      try { ls = localStorage.getItem("movai-lang"); } catch (e) {}
      if ((ls === "en" || ls === "kh") && typeof lang !== "undefined" && ls !== lang) {
        lang = ls;
        if (typeof applyLang === "function") applyLang();
      } else if (typeof lang !== "undefined") {
        var seg = document.getElementById("langSeg");
        if (seg) { var bs = seg.querySelectorAll("button"); for (var i = 0; i < bs.length; i++) bs[i].classList.toggle("on", bs[i].getAttribute("data-lang-val") === lang); }
      }
      if (typeof menuAuthState === "function") menuAuthState();
    } catch (e) {}
  }
  if (menuSignOut) menuSignOut.addEventListener("click", function(){
    setMenu(false);
    try { localStorage.removeItem("movai-session"); } catch (e) {}
    location.reload();
  });
  menuAuthState();
  menuEl.addEventListener("click", function(e){
    if (e.target && e.target.tagName === "A") setMenu(false);
  });

  /* ---- Download Center ---- */
  function cleanErr(msg){
    var s = String(msg || "").trim();
    s = s.replace(/^\s*(Suno|MusicAPI|Magic Hour|NovAI|Groq|OpenRouter|ACE Music|Agnes|MVSEP|Cobalt|cobalt|meowing|Render|VidFetch|VideoFetch)\s*:\s*/i, "");
    s = s.replace(/\b(Suno|MusicAPI|Magic Hour|NovAI|Groq|OpenRouter|ACE Music|Agnes|MVSEP|Cobalt|cobalt|meowing|Render|VidFetch|VideoFetch)\b/gi, "");
    s = s.replace(/:\s*:/g, ":").replace(/\s{2,}/g, " ").trim();
    return s || t("dlFailed");
  }
  function curEmail(){
    try { return (localStorage.getItem("movai-session") || "").trim(); } catch (e) { return ""; }
  }
  function detectPlatform(url){
    var u = String(url || "").toLowerCase();
    if (u.indexOf("youtube.com") >= 0 || u.indexOf("youtu.be") >= 0 || u.indexOf("music.youtube.com") >= 0) return "youtube";
    if (u.indexOf("tiktok.com") >= 0) return "tiktok";
    if (u.indexOf("facebook.com") >= 0 || u.indexOf("fb.watch") >= 0) return "facebook";
    if (u.indexOf("instagram.com") >= 0) return "instagram";
    return "other";
  }
  function platKey(p){
    if (p === "youtube") return "dlPlatYoutube";
    if (p === "tiktok") return "dlPlatTiktok";
    if (p === "facebook") return "dlPlatFacebook";
    if (p === "instagram") return "dlPlatInstagram";
    return "dlPlatOther";
  }

  var urlInput = document.getElementById("dlUrl");
  var pasteBtn = document.getElementById("dlPaste");
  var platEl = document.getElementById("dlPlat");
  var goBtn = document.getElementById("dlGo");
  var statusEl = document.getElementById("dlStatus");
  var errEl = document.getElementById("dlErr");
  var dailyEl = document.getElementById("dlDaily");
  var signinBox = document.getElementById("dlSignin");
  var dlBox = document.getElementById("dlBox");
  var fmtMp4 = document.getElementById("dlFmtMp4");
  var fmtMp3 = document.getElementById("dlFmtMp3");
  var qualityWrap = document.getElementById("dlQualityWrap");
  var qualityRow = document.getElementById("dlQualityRow");

  var curFormat = "mp4";
  var curQuality = "1080";
  var busy = false;
  var statusTimer = null;
  var statusSecs = 0;
  var lastDaily = null;
  var lastGb = null;

  function renderPlatLine(){
    var u = urlInput.value.trim();
    var key = u ? detectPlatform(u) : "";
    platEl.textContent = u ? t(platKey(key)) : "";
    if (platRow) platRow.hidden = !u;
  }
  function setErr(msg){ errEl.textContent = msg || ""; }
  function setStatus(msg){ statusEl.textContent = msg || ""; }
  function startTicker(){
    stopTicker();
    statusSecs = 0;
    setStatus(t("dlWorking") + " 0s");
    statusTimer = setInterval(function(){
      statusSecs++;
      setStatus(t("dlWorking") + " " + statusSecs + "s");
    }, 1000);
  }
  function stopTicker(){ if (statusTimer) { clearInterval(statusTimer); statusTimer = null; } }
  function showDaily(j){
    if (j && j.daily && typeof j.daily.left === "number") {
      lastDaily = j.daily;
      dailyEl.textContent = t("dlLeft") + " " + j.daily.left + " / 20";
    }
  }
  /* Re-render the counters in the current language (language switch). */
  function renderCounters(){
    if (lastDaily) showDaily({ daily: lastDaily });
    if (lastGb) showGb(lastGb);
  }
  function syncDlAuth(){
    var em = curEmail();
    signinBox.hidden = !!em;
    dlBox.hidden = !em;
    goBtn.disabled = !em;
  }
  function setFormat(f){
    curFormat = f;
    fmtMp4.classList.toggle("on", f === "mp4");
    fmtMp3.classList.toggle("on", f === "mp3");
    fmtMp4.setAttribute("aria-pressed", f === "mp4" ? "true" : "false");
    fmtMp3.setAttribute("aria-pressed", f === "mp3" ? "true" : "false");
    qualityWrap.hidden = (f !== "mp4");
    hidePreview();
  }
  function setQuality(q){
    curQuality = q;
    var bs = qualityRow.querySelectorAll("button[data-q]");
    for (var i = 0; i < bs.length; i++) {
      var on = bs[i].getAttribute("data-q") === q;
      bs[i].classList.toggle("on", on);
      bs[i].setAttribute("aria-pressed", on ? "true" : "false");
    }
    hidePreview();
  }
  function fileNameFor(suggested, format, url){
    var ext = format === "mp3" ? "mp3" : "mp4";
    /* Titles have no extension — sanitize and add one, so the saved
       file is "Title.mp4" / "Title.mp3", never extension-less. */
    var name = String(suggested || "").trim().replace(/[\\/:*?"<>|]/g, "").replace(/\s+/g, " ").trim();
    if (name) {
      if (!/\.(mp4|mp3|webm|m4a)$/i.test(name)) name += "." + ext;
      return name.slice(0, 120);
    }
    var m = String(url || "").match(/\.(mp4|mp3|webm|m4a)(?:[?#]|$)/i);
    if (m) ext = m[1].toLowerCase();
    return "MovAi-" + Date.now().toString(36) + "." + ext;
  }
  var previewBox = document.getElementById("dlPreview");
  var thumbImg = document.getElementById("dlThumb");
  var thumbFallback = document.getElementById("dlThumbFallback");
  var titleEl = document.getElementById("dlTitle");
  var sourceEl = document.getElementById("dlSource");
  var rowsBox = document.getElementById("dlRows");
  var moreBtn = document.getElementById("dlMore");
  var moreRowsBox = document.getElementById("dlMoreRows");
  var rowNoteEl = document.getElementById("dlRowNote");
  var downloadBtn = document.getElementById("dlDownloadBtn");
  var platRow = document.getElementById("dlPlatRow");

  var currentUrl = "";
  var titleKnown = false;
  var thumbIdUrl = "";
  var rowList = [];
  var selectedRow = null;
  var hasVideoRow = false;
  var hasMusicRow = false;
  var infoFormats = [];
  var mainVideoQ = "";
  var currentJobId = "";
  var currentStatusText = "";
  var pollTimer = null;
  var pollSecs = 0;

  /* ---- preview: thumbnail + title from /v1/info (never a guess) ---- */
  function ytVideoId(u){
    var m = String(u || "").match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?[^#]*v=|shorts\/|embed\/|live\/))([A-Za-z0-9_-]{11})/);
    return m ? m[1] : "";
  }
  function setPreviewShell(url, info){
    var host = "";
    try { host = new URL(url).hostname; } catch (e) {}
    sourceEl.textContent = host;
    titleEl.textContent = (info && info.title) ? info.title : url;
    titleKnown = !!(info && info.title);
    var thumb = (info && info.thumbnail) ? info.thumbnail : "";
    if (!thumb) {
      var id = ytVideoId(url);
      if (id) thumb = "https://i.ytimg.com/vi/" + id + "/hqdefault.jpg";
    }
    thumbIdUrl = thumb;
    if (thumb) {
      thumbImg.src = thumb;
      thumbImg.hidden = false;
      thumbFallback.hidden = true;
    } else {
      thumbImg.hidden = true;
      thumbFallback.hidden = false;
    }
  }
  thumbImg.addEventListener("error", function(){
    if (thumbIdUrl && thumbImg.getAttribute("src") !== thumbIdUrl) {
      thumbImg.src = thumbIdUrl;
    } else {
      thumbImg.hidden = true;
      thumbFallback.hidden = false;
    }
  });

  /* ---- real file sizes from /v1/info (never a guessed size) ---- */
  function fmtSize(n){
    if (!n || n <= 0) return "";
    if (n >= 1048576) return (n / 1048576).toFixed(1) + " MB";
    if (n >= 1024) return Math.round(n / 1024) + " KB";
    return n + " B";
  }

  /* ---- format rows: choices, not files — the file comes from the job.
     A quality /v1/info does not list is never shown. ---- */
  function videoQualities(){
    var out = [];
    infoFormats.forEach(function(f){
      if (!f || typeof f.quality !== "string") return;
      var m = f.quality.match(/^(\d+)p?$/);
      if (!m) return;
      var q = m[1];
      var size = (typeof f.size_bytes === "number" && Number.isFinite(f.size_bytes)) ? f.size_bytes : null;
      var i, found = null;
      for (i = 0; i < out.length; i++) { if (out[i].q === q) { found = out[i]; break; } }
      if (found) { if (size !== null && (found.size === null || size > found.size)) found.size = size; }
      else out.push({ q: q, n: parseInt(q, 10), size: size });
    });
    out.sort(function(a, b){ return b.n - a.n; });
    return out;
  }
  function musicSize(){
    var s = null;
    infoFormats.forEach(function(f){
      if (f && typeof f.quality === "string" && f.quality.toLowerCase() === "mp3") {
        if (typeof f.size_bytes === "number" && Number.isFinite(f.size_bytes)) s = f.size_bytes;
      }
    });
    return s;
  }
  function addRow(kind, label, sizeBytes, quality){
    var b = document.createElement("button");
    b.type = "button";
    b.className = "dl-row";
    var labelEl = document.createElement("span");
    labelEl.className = "dl-row-label";
    labelEl.textContent = label;
    var checkEl = document.createElement("span");
    checkEl.className = "dl-row-check";
    checkEl.textContent = "✓";
    var sizeEl = document.createElement("span");
    sizeEl.className = "dl-row-size";
    sizeEl.textContent = fmtSize(sizeBytes);
    b.appendChild(labelEl);
    b.appendChild(checkEl);
    b.appendChild(sizeEl);
    var row = { kind: kind, label: label, quality: quality || "", button: b };
    b.addEventListener("click", function(){ selectRow(row); });
    rowsBox.appendChild(b);
    rowList.push(row);
    return row;
  }
  function selectRow(row){
    rowList.forEach(function(r){ r.button.classList.toggle("sel", r === row); });
    selectedRow = row;
    downloadBtn.disabled = false;
  }
  function hidePreview(){
    stopPoll();
    previewBox.hidden = true;
    rowsBox.innerHTML = "";
    moreRowsBox.innerHTML = "";
    moreRowsBox.hidden = true;
    moreBtn.hidden = true;
    rowNoteEl.textContent = "";
    rowList = [];
    selectedRow = null;
    hasVideoRow = false;
    hasMusicRow = false;
    infoFormats = [];
    mainVideoQ = "";
    currentJobId = "";
    downloadBtn.disabled = true;
    titleKnown = false;
  }
  function buildRows(){
    var quals = videoQualities();
    var mainQ = null;
    var i;
    for (i = 0; i < quals.length; i++) { if (quals[i].n <= parseInt(curQuality, 10)) { mainQ = quals[i]; break; } }
    if (!mainQ && quals.length) mainQ = quals[0];
    mainVideoQ = mainQ ? mainQ.q : "";
    rowsBox.innerHTML = "";
    rowList = [];
    var videoRow = null, musicRow = null;
    if (mainQ) {
      videoRow = addRow("video", t("dlRowVideo") + " • " + mainQ.q + "p", mainQ.size, mainQ.q);
      hasVideoRow = true;
    }
    musicRow = addRow("music", t("dlRowMusic") + " • MP3 128 kbps", musicSize(), "mp3");
    hasMusicRow = true;
    var want = curFormat === "mp3" ? musicRow : (videoRow || musicRow);
    selectRow(want);
    var extras = quals.filter(function(x){ return !mainQ || x.q !== mainQ.q; });
    moreBtn.hidden = extras.length === 0;
    moreRowsBox.hidden = true;
    moreRowsBox.innerHTML = "";
  }
  /* "More formats": the other qualities /v1/info listed — sizes already
     known, nothing to resolve. A quality that was not listed never
     appears here either. */
  function showMore(){
    moreBtn.hidden = true;
    moreRowsBox.hidden = false;
    moreRowsBox.innerHTML = "";
    var quals = videoQualities();
    var shown = 0;
    quals.forEach(function(x){
      if (mainVideoQ && x.q === mainVideoQ) return;
      var b = document.createElement("button");
      b.type = "button";
      b.className = "dl-row";
      var labelEl = document.createElement("span");
      labelEl.className = "dl-row-label";
      labelEl.textContent = t("dlRowVideo") + " • " + x.q + "p";
      var checkEl = document.createElement("span");
      checkEl.className = "dl-row-check";
      checkEl.textContent = "✓";
      var sizeEl = document.createElement("span");
      sizeEl.className = "dl-row-size";
      sizeEl.textContent = fmtSize(x.size);
      b.appendChild(labelEl);
      b.appendChild(checkEl);
      b.appendChild(sizeEl);
      var row = { kind: "video", label: labelEl.textContent, quality: x.q, button: b };
      b.addEventListener("click", function(){ selectRow(row); });
      moreRowsBox.appendChild(b);
      rowList.push(row);
      shown++;
    });
    if (!shown) {
      var note = document.createElement("div");
      note.className = "dl-note";
      note.textContent = t("dlNoMoreFormats");
      moreRowsBox.appendChild(note);
    }
  }

  /* ---- monthly quota counter ---- */
  function showGb(j){
    var gbEl = document.getElementById("dlGb");
    if (!gbEl) return;
    if (j && j.ok && typeof j.remaining_gb === "number" && typeof j.limit_gb === "number") {
      lastGb = j;
      gbEl.textContent = t("dlGbLeft").replace("{a}", String(j.remaining_gb)).replace("{b}", String(j.limit_gb));
    } else {
      lastGb = null;
      gbEl.textContent = "";
    }
  }
  function refreshGb(){
    if (!curEmail()) return;
    apiGet("/api/download/vidfetch/usage?email=" + encodeURIComponent(curEmail()), 30000).then(function(j){
      showGb(j);
    }).catch(function(){ /* quota line stays blank — never blocks */ });
  }

  /* ---- polling: every 5s, live ticking seconds + the real status.
     A poll that fails once never kills the job — the next tick retries.
     After 10 minutes the job is given up on (timeout). ---- */
  function stopPoll(){ if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }
  function pollStatus(){
    stopPoll();
    pollSecs = 0;
    var jobId = currentJobId;
    function tick(){
      pollSecs++;
      if (pollSecs >= 600) {
        stopPoll();
        currentJobId = "";
        busy = false;
        goBtn.disabled = false;
        downloadBtn.disabled = false;
        setStatus("");
        setErr(t("dlTimeout"));
        return;
      }
      setStatus((currentStatusText || t("dlWorking")) + " " + pollSecs + "s");
    }
    function checkOnce(){
      if (!currentJobId || currentJobId !== jobId) return;
      apiPost("/api/download/vidfetch/status", { email: curEmail(), jobId: jobId }, 40000).then(function(j){
        if (!j || !currentJobId || currentJobId !== jobId) return;
        if (!j.ok) {
          stopPoll();
          busy = false;
          goBtn.disabled = false;
          downloadBtn.disabled = false;
          setStatus("");
          if (j.needLogin) { setErr(t("dlNeedSignIn")); syncDlAuth(); }
          else setErr(cleanErr(j.error));
          return;
        }
        if (j.daily) showDaily(j);
        if (j.status === "completed" && j.download_url) {
          stopPoll();
          busy = false;
          goBtn.disabled = false;
          setStatus(t("dlReady"));
          currentStatusText = "";
          blobDownload(j.download_url, fileNameFor(titleKnown ? titleEl.textContent : "", selectedRow && selectedRow.kind === "music" ? "mp3" : "mp4", currentUrl), downloadBtn, "dlDownload");
          refreshGb();
          return;
        }
        if (j.status === "failed" || j.status === "deleted" || j.status === "cancelled") {
          stopPoll();
          busy = false;
          goBtn.disabled = false;
          downloadBtn.disabled = false;
          setStatus("");
          setErr(cleanErr(j.error));
          return;
        }
        currentStatusText = j.status === "queued" ? t("dlQueued") : t("dlProcessing");
        var pct = (typeof j.progress === "number" && j.progress > 0) ? " • " + Math.floor(j.progress) + "%" : "";
        setStatus(currentStatusText + pct + " " + pollSecs + "s");
      }).catch(function(){
        /* one failed poll never kills the job — the next tick retries */
      });
    }
    pollTimer = setInterval(function(){
      tick();
      checkOnce();
    }, 5000);
    tick();
    checkOnce();
  }

  /* START: paste link → tap START → info → preview panel + rows with
     REAL sizes. No wake-up, no phone-direct fallback, no bot-check —
     the API is always awake. */
  function runStart(){
    if (busy) return;
    var email = curEmail();
    if (!email) { setErr(t("dlNeedSignIn")); syncDlAuth(); return; }
    var url = urlInput.value.trim();
    if (!url) { setErr(t("dlNeedUrl")); urlInput.focus(); return; }
    if (!/^https?:\/\//i.test(url)) { setErr(t("dlBadUrl")); return; }
    currentUrl = url;
    busy = true;
    goBtn.disabled = true;
    setErr("");
    dailyEl.textContent = "";
    hidePreview();
    previewBox.hidden = false;
    setPreviewShell(url, null);
    startTicker();
    apiPost("/api/download/vidfetch/info", { email: email, url: url }, 60000).then(function(j){
      stopTicker();
      setStatus("");
      busy = false;
      goBtn.disabled = false;
      if (!j) { hidePreview(); setErr(t("dlNoServer")); return; }
      if (j.needLogin) { hidePreview(); setErr(t("dlNeedSignIn")); syncDlAuth(); return; }
      if (!j.ok) { hidePreview(); setErr(cleanErr(j.error)); return; }
      infoFormats = Array.isArray(j.formats) ? j.formats : [];
      setPreviewShell(url, j);
      if (!infoFormats.length) { setErr(t("dlNoFormats")); return; }
      buildRows();
    }).catch(function(){
      stopTicker();
      setStatus("");
      busy = false;
      goBtn.disabled = false;
      hidePreview();
      setErr(t("dlNoServer"));
    });
  }

  /* Download: create the job, then poll until it is ready. */
  function runDownload(){
    if (busy) return;
    var email = curEmail();
    if (!email) { setErr(t("dlNeedSignIn")); syncDlAuth(); return; }
    if (!selectedRow || !currentUrl) return;
    busy = true;
    downloadBtn.disabled = true;
    setErr("");
    setStatus(t("dlWorking") + " 0s");
    var format = selectedRow.kind === "music" ? "mp3" : "mp4";
    var quality = selectedRow.kind === "music" ? "" : selectedRow.quality;
    apiPost("/api/download/vidfetch/create", { email: email, url: currentUrl, format: format, quality: quality }, 60000).then(function(j){
      if (!j) { busy = false; downloadBtn.disabled = false; setStatus(""); setErr(t("dlNoServer")); return; }
      if (j.needLogin) { busy = false; downloadBtn.disabled = false; setStatus(""); setErr(t("dlNeedSignIn")); syncDlAuth(); return; }
      if (!j.ok) {
        busy = false;
        downloadBtn.disabled = false;
        setStatus("");
        if (j.daily) showDaily(j);
        setErr(cleanErr(j.error));
        return;
      }
      if (j.daily) showDaily(j);
      currentJobId = j.jobId || "";
      if (!currentJobId) { busy = false; downloadBtn.disabled = false; setStatus(""); setErr(t("dlFailed")); return; }
      currentStatusText = t("dlQueued");
      pollStatus();
    }).catch(function(){
      busy = false;
      downloadBtn.disabled = false;
      setStatus("");
      setErr(t("dlNoServer"));
    });
  }

  /* ---- blob download: Chrome ignores the download attribute on
     cross-origin links, so fetch as a blob and save it locally. ---- */
  function blobDownload(url, filename, btn, labelKey){
    btn.disabled = true;
    btn.textContent = t("dlDownloadingFile");
    fetch(url, { mode: "cors" }).then(function(r){
      if (!r.ok) throw new Error("http " + r.status);
      return r.blob();
    }).then(function(blob){
      var objUrl = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = objUrl;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function(){ try { URL.revokeObjectURL(objUrl); } catch (e) {} }, 5000);
      setStatus(t("dlDownloaded"));
      btn.disabled = false;
      btn.textContent = t(labelKey || "dlSaveFile");
    }).catch(function(){
      btn.disabled = false;
      btn.textContent = t(labelKey || "dlSaveFile");
      setErr(t("dlFailed"));
      try { window.open(url, "_blank"); } catch (e) {}
    });
  }

  urlInput.addEventListener("input", renderPlatLine);
  urlInput.addEventListener("change", renderPlatLine);
  pasteBtn.addEventListener("click", function(){
    if (navigator.clipboard && navigator.clipboard.readText) {
      navigator.clipboard.readText().then(function(txt){
        if (txt) { urlInput.value = String(txt).trim(); renderPlatLine(); }
      }).catch(function(){
        setErr(t("dlPasteFail"));
        urlInput.focus();
      });
    } else {
      urlInput.focus();
      setErr(t("dlPasteFail"));
    }
  });
  fmtMp4.addEventListener("click", function(){ setFormat("mp4"); });
  fmtMp3.addEventListener("click", function(){ setFormat("mp3"); });
  qualityRow.addEventListener("click", function(e){
    var b = e.target && e.target.closest ? e.target.closest("button[data-q]") : null;
    if (b) setQuality(b.getAttribute("data-q"));
  });
  goBtn.addEventListener("click", runStart);
  downloadBtn.addEventListener("click", runDownload);
  moreBtn.addEventListener("click", showMore);

  syncDlAuth();
  applyLang();
  refreshGb();
})();
</script>
<script>
(function(){
  "use strict";
  /* ---- Chat button: slides in from the right edge on app open (blurry to
     clear); if untouched for 10s it fades back to blurry, slides out to the
     right and disappears completely; it returns on the next app open. ---- */
  var fab = document.getElementById("chatFab");
  if (!fab) return;
  var HIDE_MS = 10000;
  var hideTimer = null;
  function openChat(){
    if (window.location.pathname && window.location.pathname.indexOf("movai-new-chat.html") !== -1) {
      var inp = document.getElementById("chatInput");
      if (inp) { inp.focus(); }
      window.scrollTo(0, document.body.scrollHeight);
      return;
    }
    window.location.href = "movai-new-chat.html";
  }
  function hideFab(){
    fab.classList.remove("in");
    fab.classList.add("out");
    setTimeout(function(){ fab.style.display = "none"; }, 500);
  }
  function cancelHide(){ if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; } }
  fab.addEventListener("pointerdown", cancelHide);
  fab.addEventListener("mouseenter", cancelHide);
  fab.addEventListener("touchstart", cancelHide, { passive: true });
  fab.addEventListener("focus", cancelHide);
  fab.addEventListener("click", function(e){ e.preventDefault(); cancelHide(); openChat(); });
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      fab.classList.add("in");
      hideTimer = setTimeout(hideFab, HIDE_MS);
    });
  });
})();
</script>
</body>
</html>
