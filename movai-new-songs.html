<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2faf6">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="movai-icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="movai-icon-512.png">
<link rel="apple-touch-icon" href="movai-icon-192.png">
<title>MovAi Music Generate Kh — My Songs</title>
<script>try{var _mt=localStorage.getItem("movai-theme")||"auto";var _md=_mt==="auto"?window.matchMedia("(prefers-color-scheme: dark)").matches:_mt==="night";document.documentElement.setAttribute("data-theme",_md?"dark":"light");}catch(e){document.documentElement.setAttribute("data-theme","light")}</script>
<style>
  /* MovAi new — clean look, one single pale background, no layers. */
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;overflow-x:hidden}
  html{
    background:linear-gradient(180deg,#e8f5f0 0%,#f2faf6 45%,#ffffff 100%);
    background-attachment:fixed;
    -webkit-text-size-adjust:100%;
  }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    color:#1f2937;
    background:linear-gradient(180deg,#e8f5f0 0%,#f2faf6 45%,#ffffff 100%);
    background-attachment:fixed;
    min-height:100vh;
  }
  a{color:#1f2937;text-decoration:none}
  button{font:inherit;color:inherit;background:transparent;border:0;padding:0;cursor:pointer}
  img{display:block;max-width:100%}

  .wrap{max-width:720px;margin:0 auto}

  /* ---- Header: two rows, directly on the background (transparent) ---- */
  header{position:fixed;top:0;left:0;right:0;z-index:50;max-width:720px;margin:auto;
    background:linear-gradient(180deg,#e8f5f0 0%,#f2faf6 45%,#ffffff 100%);
    background-attachment:fixed;}
  .hdr-row{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding-left:16px;padding-right:16px}
  .hdr-top{padding-top:14px;padding-bottom:10px;border-bottom:1px solid #e5e7eb}
  .hdr-sub{padding-top:11px;padding-bottom:11px;border-bottom:1px solid #e5e7eb}
  .hdr-logo{display:flex;align-items:center;gap:8px;color:#1f2937;min-width:0}
  .hdr-logo svg,.hdr-logo img{flex:none}
  .hdr-logo b{font-size:1.3rem;font-weight:800;letter-spacing:-.02em;color:#1f2937;line-height:1}
  .hdr-right{display:flex;align-items:center;gap:4px}
  .icon-btn{font-size:1.35rem;line-height:1;color:#1f2937;padding:4px 9px;border-radius:8px}
  .icon-btn:active{background:#e5e7eb}
  .hdr-sec{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
  .hdr-sec .icon-btn{padding:4px 8px}
  .hdr-sec-name{font-size:1rem;font-weight:600;color:#1f2937;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hdr-btn{flex:none;font-size:.9rem;font-weight:600;color:#1f2937;
    border:1px solid #d1d5db;border-radius:8px;padding:6px 12px;background:transparent}
  .hdr-btn:active{background:#e5e7eb}
  /* ---- .mini-btn (stage 18): a real visible button, not plain text ---- */
  .mini-btn{font-size:.85rem;font-weight:700;padding:9px 14px;border-radius:10px;border:1px solid #0f766e;background:#0f766e;color:#fff;cursor:pointer}
  .mini-btn:active{opacity:.85}
  .mini-btn.stem-cancel-btn{background:transparent;border-color:#d1d5db;color:#1f2937}
  html[data-theme="dark"] .mini-btn.stem-cancel-btn{border-color:#3a524a;color:#e7f0ec}

  /* ---- Bottom menu: fixed bottom-left button, bottom sheet (never rises to the top) ---- */
  .menu-fab{position:fixed;left:16px;bottom:16px;z-index:60;
    width:52px;height:52px;border-radius:50%;
    background:#f2faf6;border:1px solid #d1d5db;
    font-size:1.4rem;line-height:1;color:#1f2937;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 10px rgba(0,0,0,.12);transition:opacity .25s ease}
  .menu-fab:active{background:#e5e7eb}
  .menu-veil{position:fixed;inset:0;z-index:55;display:none;
    background:rgba(242,250,246,.55);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
  .menu-veil.open{display:block;animation:veilIn .18s ease-out}
  @keyframes veilIn{from{opacity:0}to{opacity:1}}
  .menu{position:fixed;left:0;right:0;bottom:0;z-index:56;
    max-height:70vh;overflow-y:auto;
    background:#f2faf6;border-top:1px solid #e5e7eb;border-radius:16px 16px 0 0;
    padding:6px 0 calc(10px + env(safe-area-inset-bottom,0px));
    transform:translateY(105%);transition:transform .22s ease-out;
    visibility:hidden}
  .menu.open{transform:translateY(0);visibility:visible;animation:sheetIn .25s ease-out}
  @keyframes sheetIn{from{filter:blur(6px)}to{filter:blur(0)}}
  .menu.open + .menu-fab{display:none}
  .menu a,.menu button.menu-link{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    padding:13px 20px;font-size:.95rem;color:#1f2937;border-bottom:1px solid #eef1f0;background:transparent}
  .menu a .nav-ic{display:inline-flex;flex:none;line-height:0}
  .menu a .nav-ic svg{display:block;width:20px;height:20px}
  .menu a:last-child,.menu button.menu-link:last-child{border-bottom:0}
  .menu a:active,.menu button.menu-link:active{background:#e5e7eb}
  .menu .menu-sep{height:1px;background:#e5e7eb;margin:6px 0}
  .menu .menu-user{padding:12px 20px 4px;font-size:.85rem;color:#6b7280}
  [hidden]{display:none !important}

  /* ---- My Songs: plain list rows directly on the background ---- */
  main{padding-top:108px;padding-bottom:120px}
  .count{padding:16px 16px 4px;font-size:.95rem;font-weight:600;color:#1f2937}
  .count:empty{display:none}
  .note{padding:2px 16px 0;font-size:.8rem;color:#6b7280}
  .note:empty{display:none}
  .list{animation:fade .3s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    padding:12px 16px;background:transparent;border:0;border-bottom:1px solid #eef1f0;
    cursor:pointer}
  .row:active{background:#eef1f0}
  .thumb{width:56px;height:56px;flex:none;border-radius:8px;object-fit:cover;background:#dfe7e2}
  .row-text{flex:1;min-width:0}
  .row-title{display:block;font-size:.95rem;font-weight:600;color:#1f2937;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row-sub{display:block;font-size:.8rem;color:#6b7280;margin-top:3px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row-dur{flex:none;font-size:.85rem;color:#6b7280}
  .row.playing .row-title{color:#0f766e}
  .status{padding:28px 16px;text-align:center;color:#6b7280;font-size:.95rem}
  .status a{text-decoration:underline}
  .retry{margin-top:10px;color:#1f2937;text-decoration:underline;font-size:.95rem}

  /* ---- Creating rows (two per generation, logo + live seconds) ---- */
  .creating{margin-top:8px}
  .c-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    padding:12px 16px;background:transparent;border:0;border-bottom:1px solid #eef1f0}
  .c-logo{width:44px;height:44px;flex:none;border-radius:8px;object-fit:contain;background:#dfe7e2;padding:4px}
  .c-text{flex:1;min-width:0}
  .c-title{display:block;font-size:.95rem;font-weight:600;color:#1f2937;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .c-sub{display:block;font-size:.8rem;color:#6b7280;margin-top:3px}
  .c-sub .secs{font-weight:700;color:#1f2937}
  .spin{flex:none;width:22px;height:22px;border-radius:50%;
    border:2px solid #d1d5db;border-top-color:#0f766e;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .c-play{flex:none;width:44px;height:44px;border:1px solid #d1d5db;border-radius:50%;
    font-size:1rem;color:#1f2937;line-height:1}
  .c-play:active{background:#e5e7eb}
  .c-dl{flex:none;font-size:.85rem;color:#1f2937;text-decoration:underline}
  .c-err{font-size:.85rem;color:#991b1b}
  .c-retry{flex:none;font-size:.85rem;font-weight:600;color:#0f766e;text-decoration:underline}
  /* ---- Row actions + stem box ---- */
  .song-item{border-bottom:1px solid #eef1f0}
  .row{border-bottom:0}
  .row-acts{flex:none;display:flex;align-items:center;gap:10px}
  .row-dl{font-size:.85rem;color:#1f2937;text-decoration:underline}
  .row-act{font-size:.85rem;color:#1f2937;text-decoration:underline}
  .row-act.armed{color:#991b1b;font-weight:700}
  .row-icon-btn{flex:none;width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;
    color:#1f2937;background:transparent;border:0;border-radius:8px;padding:0;cursor:pointer}
  .row-icon-btn:active{background:#e5e7eb}
  .row-icon-btn svg{width:20px;height:20px;flex:none}
  /* ---- Song row ⋮ menu: small anchored popup ---- */
  .song-menu-veil{position:fixed;inset:0;z-index:70;display:none;background:transparent}
  .song-menu-veil.open{display:block}
  .song-menu{position:fixed;z-index:71;display:none;min-width:210px;max-width:min(260px,calc(100vw - 24px));
    max-height:calc(100vh - 16px);overflow-y:auto;
    background:#ffffff;border:1px solid #d3e5da;border-radius:12px;padding:6px;
    box-shadow:0 8px 24px rgba(0,0,0,.14)}
  .song-menu.open{display:block}
  .song-menu-item{display:flex;width:100%;align-items:center;text-align:left;
    padding:11px 12px;font-size:.92rem;color:#1f2937;background:transparent;border:0;border-radius:8px;
    cursor:pointer;text-decoration:none;box-sizing:border-box}
  .song-menu-item:active{background:#f2faf6}
  .song-menu-item.danger{color:#991b1b}
  .song-menu-item.armed{color:#991b1b;font-weight:700}
  .stem-box{padding:4px 16px 14px}
  .stem-box .hint{font-size:.82rem;color:#6b7280;margin:6px 0}
  .stem-msg{font-size:.85rem;color:#6b7280;margin-top:8px;min-height:16px}
  .stem-msg.err-t{color:#991b1b}
  .stem-row{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:8px 0;border-bottom:1px solid #eef1f0;font-size:.9rem}
  .stem-row:last-child{border-bottom:0}
  .stem-proc{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 0 6px}
  .stem-logo{position:relative;width:56px;height:56px}
  .stem-logo img{width:56px;height:56px;animation:spin 2.5s linear infinite}
  .stem-logo .stem-ring{position:absolute;inset:-7px;border-radius:50%;border:3px solid transparent;border-top-color:#0f766e;border-right-color:#0f766e;animation:spin 1.1s linear infinite}
  .stem-logo .stem-shadow{position:absolute;inset:-12px;border-radius:50%;background:conic-gradient(from 0deg,rgba(15,118,110,.5),transparent 45%,rgba(15,118,110,.35) 70%,transparent);filter:blur(10px);animation:spin 2.8s linear infinite}
  .stem-stage{font-size:.9rem;color:#374151;text-align:center}
  html[data-theme="dark"] .stem-stage{color:#e7f0ec}
  .stem-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .stem-play{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid #cbd5d1;background:#fff;font-size:.95rem;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .stem-play.on{background:linear-gradient(135deg,#ec4899,#f97316);border-color:transparent;color:#fff}
  .stem-mute{flex:none;width:32px;height:32px;border-radius:8px;border:1px solid #cbd5d1;background:transparent;font-size:.8rem;font-weight:700;cursor:pointer}
  .stem-mute.off{background:#e5e7eb;color:#6b7280;text-decoration:line-through}
  .stem-row.playing{background:linear-gradient(90deg,#fce7f3,#ffedd5);border-radius:10px}
  html[data-theme="dark"] .stem-play{background:#16261f;border-color:#3a524a;color:#e7f0ec}
  html[data-theme="dark"] .stem-mute{border-color:#3a524a;color:#e7f0ec}
  html[data-theme="dark"] .stem-mute.off{background:#1d2f28;color:#8fa89e}
  html[data-theme="dark"] .stem-row.playing{background:linear-gradient(90deg,rgba(236,72,153,.22),rgba(249,115,22,.22))}
  /* ---- Stem panel (stage 13): own full-screen panel, blurred backdrop ---- */
  .stem-panel-veil{position:fixed;inset:0;z-index:90;background:rgba(10,25,20,.45);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;flex-direction:column}
  .stem-panel-veil[hidden]{display:none}
  .stem-panel{flex:1;min-height:0;display:flex;flex-direction:column;background:linear-gradient(180deg,#e8f5f0 0%,#f2faf6 45%,#ffffff 100%);max-width:720px;width:100%;margin:0 auto;overflow:hidden}
  html[data-theme="dark"] .stem-panel{background:#0e1a15;color:#e7f0ec}
  .stem-panel-hdr{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid #e5e7eb}
  html[data-theme="dark"] .stem-panel-hdr{border-bottom-color:#24362f}
  .stem-panel-title{flex:1;min-width:0;font-size:.95rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stem-panel-close{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid #d1d5db;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#1f2937}
  .stem-panel-close svg{width:20px;height:20px;fill:currentColor}
  html[data-theme="dark"] .stem-panel-close{border-color:#3a524a;color:#e7f0ec}
  .stem-proc-view{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px}
  .stem-proc-view[hidden]{display:none}
  .stem-logo-big{position:relative;width:96px;height:96px}
  .stem-logo-big img{width:96px;height:96px;animation:spin 2.5s linear infinite}
  .stem-logo-big .stem-ring-big{position:absolute;inset:-10px;border-radius:50%;border:4px solid transparent;border-top-color:#0f766e;border-right-color:#0f766e;animation:spin 1.1s linear infinite}
  .stem-logo-big .stem-shadow-big{position:absolute;inset:-18px;border-radius:50%;background:conic-gradient(from 0deg,rgba(15,118,110,.5),transparent 45%,rgba(15,118,110,.35) 70%,transparent);filter:blur(14px);animation:spin 2.8s linear infinite}
  .stem-mix-view{flex:1;min-height:0;display:flex;flex-direction:column}
  .stem-mix-view[hidden]{display:none}
  .stem-master{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid #e5e7eb}
  html[data-theme="dark"] .stem-master{border-bottom-color:#24362f}
  .stem-master-play{flex:none;width:52px;height:52px;border-radius:50%;background:#0f766e;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .stem-master-play svg{width:28px;height:28px;fill:currentColor}
  .stem-time{font-size:.9rem;font-weight:700;font-variant-numeric:tabular-nums}
  .stem-scroll{flex:1;min-height:0;overflow-y:auto;padding:6px 14px 20px}
  .stem-scroll-inner{position:relative}
  .stem-ruler{position:relative;height:20px;margin:2px 0 6px;border-bottom:1px solid #e5e7eb}
  html[data-theme="dark"] .stem-ruler{border-bottom-color:#24362f}
  .stem-mark{position:absolute;top:0;font-size:.68rem;color:#6b7280;transform:translateX(-50%);white-space:nowrap}
  .stem-mark-end{transform:translateX(-100%)}
  .stem-track{display:block;padding:10px 0;border-bottom:1px solid #eef2f0}
  .stem-track-top{display:flex;align-items:center;gap:8px}
  .stem-ico{flex:none;width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff}
  .stem-ico svg{width:20px;height:20px;fill:currentColor}
  .stem-track-wave{display:flex;align-items:center;gap:10px;margin-top:8px}
  .stem-wave{flex:1;min-width:0;height:28px}
  .stem-wave svg{width:100%;height:28px;display:block}
  .stem-solo.on{background:#0f766e;color:#fff;border-color:#0f766e}
  html[data-theme="dark"] .stem-track{border-bottom-color:#24362f}
  .stem-track .stem-name{flex:1;min-width:0}
  .stem-vol{flex:none;width:90px;accent-color:#0f766e}
  .stem-playhead{position:absolute;top:0;bottom:0;width:2px;background:#0f766e;z-index:2;pointer-events:none}
  .stem-playhead::before{content:"";position:absolute;top:0;left:-4px;border:5px solid transparent;border-top:7px solid #0f766e}
  /* ---- Player seek bar (stage 14) ---- */
  .player-seek{max-width:720px;margin:8px auto 0;display:flex;align-items:center;gap:8px}
  .player-seek input[type="range"]{flex:1;min-width:0;accent-color:#0f766e}
  .player-time{font-size:.75rem;font-weight:600;color:#4b5563;min-width:36px;text-align:center;font-variant-numeric:tabular-nums}
  html[data-theme="dark"] .player-time{color:#9db8ac}
  /* ---- SVG icons (stage 15): drawn by code, not text glyphs ---- */
  .player button svg{width:20px;height:20px;fill:currentColor;vertical-align:middle}
  .player .p-close svg{width:18px;height:18px}
  .mode-ico svg{width:16px;height:16px;fill:currentColor;vertical-align:-3px}

  /* ---- Now-playing bar: slim, directly on the background ---- */
  .player{position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:linear-gradient(180deg,#e8f5f0 0%,#f2faf6 45%,#ffffff 100%);
    background-attachment:fixed;
    border-top:1px solid #e5e7eb;
    padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));}
  .player[hidden]{display:none}
  .player-in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px}
  .player-modes{max-width:720px;margin:8px auto 0;display:flex;gap:8px}
  .player-modes .mode-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:6px 10px;border:1px solid #d1d5db;border-radius:999px;background:#ffffff;font-size:.82rem;font-weight:600;color:#4b5563;cursor:pointer}
  .player-modes .mode-btn .mode-ico{font-size:1rem;line-height:1}
  .player-modes .mode-btn.on{background:#0f766e;border-color:#0f766e;color:#ffffff}
  .player img{width:40px;height:40px;flex:none;border-radius:6px;object-fit:cover;background:#dfe7e2}
  .player-title{flex:1;min-width:0;font-size:.92rem;font-weight:600;color:#1f2937;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .player button{flex:none;font-size:.9rem;font-weight:600;color:#1f2937;
    border:1px solid #d1d5db;border-radius:8px;padding:6px 11px;background:transparent}
  .player button:active{background:#e5e7eb}
  .player .p-close{border:0;font-size:1.05rem;padding:6px 8px}
  .player-err{max-width:720px;margin:6px auto 0;font-size:.82rem;font-weight:600;color:#b91c1c;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
  .player-err[hidden]{display:none}
  /* ---- Drawer settings: theme + language ---- */
  .menu-set{padding:12px 20px 6px}
  .menu-set-label{font-size:.85rem;font-weight:700;color:#6b7280;margin-bottom:8px}
  .seg-mini{display:flex;gap:6px}
  .seg-mini button{flex:1;font-size:.88rem;font-weight:600;color:#1f2937;
    border:1px solid #d1d5db;border-radius:8px;padding:8px 6px;background:transparent}
  .seg-mini button:active{background:#e5e7eb}
  .seg-mini button.on{background:#0f766e;border-color:#0f766e;color:#ffffff}
  /* ---- Chat button: bottom-right, slides in from the right edge ---- */
  .chat-fab{position:fixed;right:16px;bottom:16px;z-index:60;
    width:52px;height:52px;border-radius:50%;
    background:#0f766e;border:1px solid #0f766e;
    color:#ffffff;display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 10px rgba(0,0,0,.18);
    transform:translateX(calc(100% + 24px));opacity:0;filter:blur(6px);
    transition:transform .45s ease-out,opacity .45s ease-out,filter .45s ease-out;
    pointer-events:none}
  .chat-fab.in{transform:translateX(0);opacity:1;filter:blur(0);pointer-events:auto}
  .chat-fab.out{transform:translateX(calc(100% + 24px));opacity:0;filter:blur(6px);pointer-events:none}
  .chat-fab:active{opacity:.85}
  /* Round 4 (G): hide the chat button while the drawer is open, same as
     the menu button (which the drawer already hides). The 10s slide-away
     timer is untouched - this only covers the button while the drawer is
     open, and it returns to whatever state the timer left it in. */
  body.drawer-open .chat-fab{transform:translateX(calc(100% + 24px)) !important;opacity:0 !important;filter:blur(6px) !important;pointer-events:none !important}
  /* Round 4 (H): fade both floating buttons out while the user is
     actively scrolling, so they never cover content mid-scroll. */
  body.scrolling .menu-fab,body.scrolling .chat-fab{opacity:0 !important;pointer-events:none !important}
  .chat-fab svg{width:24px;height:24px;flex:none}
  .player-on .chat-fab{bottom:132px}
  .player-on .menu-fab{bottom:132px}
  body.player-on main{padding-bottom:190px}
  html[data-theme="dark"] .chat-fab{background:#0f766e;border-color:#0f766e;color:#ffffff;box-shadow:0 2px 10px rgba(0,0,0,.5)}
  /* ---- Night theme: same layout, dark green-tinted background ---- */
  html[data-theme="dark"]{background:#0e1a15}
  html[data-theme="dark"] body{background:#0e1a15;color:#e7f0ec}

    var v = curTheme();

  }
  function setTheme(v){ try { localStorage.setItem(THEME_KEY, v); } catch (e) {} applyTheme(); }
  if (window.matchMedia) { try { window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function(){ if (curTheme() === "auto") applyTheme(); }); } catch (e) {} }

  function apiPost(path, body, timeoutMs, onCtrl){
    var ctrl = null, timer = null;
    var opts = { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body || {}) };
    if (window.AbortController) {
      ctrl = new AbortController();
      opts.signal = ctrl.signal;
      if (typeof onCtrl === "function") { try { onCtrl(ctrl); } catch (e) {} }
      var ms = timeoutMs || 60000;
      if (ms > 0) timer = setTimeout(function(){ try { ctrl.abort(); } catch (e) {} }, ms);
    }
    return fetch(API_BASE + path, opts).then(function(r){
      if (timer) clearTimeout(timer);
      return r.json().catch(function(){ return null; });
    }).catch(function(e){
      if (timer) clearTimeout(timer);
      throw e;
    });
  }
  function normSongs(j){
    var arr = null;
    if (j && Array.isArray(j.songs)) arr = j.songs;
    else if (j && Array.isArray(j.data)) arr = j.data;
    else if (j && j.data && Array.isArray(j.data.songs)) arr = j.data.songs;
    if (!arr) return [];
    return arr.map(function(x){
      if (typeof x === "string") return { url: x, title: "" };
      if (!x || typeof x !== "object") return { url: "", title: "" };
      /* Round 3 (D): the Suno stream link (url / streamAudioUrl) answers
         HTTP 200 with an EMPTY body - it cannot play. The real audio is
         audioUrl (tempfile link). Prefer it; keep the stream link as
         streamUrl so the player can fall back to it. */
      var stream = x.url || x.streamAudioUrl || x.stream_audio_url || "";
      var audio = x.audioUrl || x.audio_url ||
                  x.permanentMp3Url || x.permanent_mp3_url || "";
      return {
        url: audio || stream,
        streamUrl: (stream && stream !== (audio || stream)) ? stream : "",
        title: x.title || "",
        image: x.image || x.cover || "",
        audioId: x.audioId || x.audio_id || x.id || "",
        taskId: x.taskId || x.task_id || "",
        duration: Number(x.duration) || 0
      };
    }).filter(function(x){ return !!x.url; });
  }

  function songStoreUrl(url, title){
    if (!/^https:/i.test(url) || url.indexOf("res.cloudinary.com") >= 0 || url.indexOf("/uploads/") >= 0) {
      return Promise.resolve(url);

    return apiPost("/api/public/song-store", { url: url, title: title || "" }, 60000).then(function(j){
      if (j && j.ok && j.url) return j.url;
      return url;
    }).catch(function(){ return url; });

    return songStoreUrl(song.url, song.title || meta.title || "").then(function(permUrl){
      var item = {
        id: id, type: "song", mode: "song", url: permUrl,
        title: song.title || meta.title || t("untitled"),

        model: displayModel(meta.model), style: meta.style || "",
        image: song.image || "",
        streamUrl: song.streamUrl || "",
        audioId: song.audioId || meta.audioId || "",
        taskId: meta.jobId || "",
        duration: Number(song.duration) || 0,
        ts: Date.now(), createdAt: new Date().toISOString(), origin: "created"

        .then(function(j){ return !!(j && j.ok !== false); })

  /* ---- pending generations (handed off by Create) ---- */

  setInterval(function(){
    var now = Date.now();
    var els = creatingBox.querySelectorAll("[data-job-secs]");
    els.forEach(function(el){
      var job = null;
      pendingJobs.forEach(function(x){ if (x.jobId === el.getAttribute("data-job-secs")) job = x; });
      if (job) el.textContent = Math.max(0, Math.floor((now - (job.startedAt || now)) / 1000)) + "s";
    });
  }, 1000);
  function pollJob(job){
    if (job.state !== "creating") return;
    if (Date.now() - (job.startedAt || Date.now()) > 10 * 60 * 1000) {
      apiPost("/api/gen/song/timeout", { provider: "suno", jobId: job.jobId }, 30000).catch(function(){});
      job.state = "failed";
      job.failMsg = t("genTimeout");
      removePending(job);
      renderCreating();
      return;
    }
    // POST /api/gen/song/status {provider, jobId} every 5s
    apiPost("/api/gen/song/status", { provider: "suno", jobId: job.jobId }, 30000).then(function(j){
      if (job.state !== "creating") return;
      if (!j) { setTimeout(function(){ pollJob(job); }, 5000); return; }
      if (j.ok === false) {
        job.state = "failed"; job.failMsg = cleanErr(j.error);
        removePending(job); renderCreating(); return;
      }
      var st = String(j.status || j.state || "").toLowerCase();
      job.stage = String(j.providerStatus || j.status || "working");
      if (st === "failed" || st === "error") {
        job.state = "failed"; job.failMsg = cleanErr(j.error);
        removePending(job); renderCreating(); return;
      }
      var songs = normSongs(j);
      songs.slice(0, 2).forEach(function(s, i){
        var slot = job.slots[i];
        if (!slot || slot.url === s.url) return;
        slot.url = s.url;
        slot.streamUrl = s.streamUrl || "";
        slot.title = s.title || job.title;
        slot.audioId = s.audioId;
        slot.taskId = s.taskId;
        slot.image = s.image;
        slot.done = true;
        finishedUrls[playUrl(s.url)] = true;
        // Save to history immediately — first-finished first, never
        // waiting for the other song.
        saveSongToHistory(s, { jobId: job.jobId, idx: i, email: job.email,
          title: job.title, model: job.model, style: job.style, lyrics: job.lyrics
        }).then(function(ok){ slot.saved = ok === true; if (ok) loadSongsQuiet(); });
        if (job.mode === "cover") coverVocalCheckFor(job, slot);
        renderCreating();
      });
      var done = st === "done" || st === "complete" || st === "completed" ||
        st === "succeeded" || st === "success" || st === "finished" || j.done === true;
      if (done) {
        job.state = "done";
        // A save that failed (offline moment) gets one fresh retry now —
        // same stable id, fresh ts, so the server merges it, never dupes.
        job.slots.forEach(function(slot, i){
          if (slot.done && slot.url && !slot.saved) {
            saveSongToHistory({ url: slot.url, title: slot.title, audioId: slot.audioId,
              taskId: slot.taskId, image: slot.image, streamUrl: slot.streamUrl || "" },
              { jobId: job.jobId, idx: i, email: job.email, title: job.title,
                model: job.model, style: job.style, lyrics: job.lyrics
              }).then(function(ok){ slot.saved = ok === true; if (ok) loadSongsQuiet(); });
          }
        });
        removePending(job);
        renderCreating();
        loadSongsQuiet();
        return;
      }
      setTimeout(function(){ pollJob(job); }, 5000);
    }).catch(function(){
      if (job.state !== "creating") return;
      setTimeout(function(){ pollJob(job); }, 5000);
    });
  }
  function coverVocalCheckFor(job, slot){
    if (slot.vocalChecked || !slot.url) return;
    slot.vocalChecked = true;
    // POST /api/gen/song/cover-vocal-check {email, audioUrl} -> {ok, hasVocals}
    apiPost("/api/gen/song/cover-vocal-check", { email: job.email, audioUrl: slot.url }, 120000).then(function(j){
      if (j && j.ok === true && j.hasVocals === false) {

  function vocalRetry(job, slot, btn){
    if (!job || !job.jobId) return;
    btn.disabled = true;
    btn.textContent = "…";
    // POST /api/gen/song/cover {email, vocalRetry:true, origJobId} — free, max 3 per job
    apiPost("/api/gen/song/cover", { email: job.email, vocalRetry: true, origJobId: job.jobId }, 60000).then(function(j){
      if (j && j.ok === true && j.jobId) {
        slot.noVocals = false;
        slot.vocalChecked = false;
        renderCreating();
        var nj = { jobId: j.jobId, mode: "cover", title: job.title, model: job.model,
          voice: job.voice, email: job.email, startedAt: Date.now(),
          style: job.style, lyrics: job.lyrics, coverUrl: job.coverUrl || "",
          slots: [{}, {}], state: "creating", stage: "sending" };

        btn.disabled = false;

  /* ---- local delete tombstones (no server delete endpoint exists) ----
     An item disappears ONLY when its own Delete is tapped (two taps). */
  function tombKey(em){ return "movai-history-" + String(em || "guest").toLowerCase() + "-deleted"; }
  function tombGet(em){
    try {
      var a = JSON.parse(localStorage.getItem(tombKey(em)) || "[]");
      return Array.isArray(a) ? a : [];
    } catch (e) { return []; }
  }
  function tombAdd(em, ids){
    if (!ids || !ids.length) return;
    try {
      var x = tombGet(em);
      ids.forEach(function(id){ if (id && x.indexOf(id) < 0) x.push(id); });
      localStorage.setItem(tombKey(em), JSON.stringify(x.slice(-600)));
    } catch (e) {}
  }

  /* Round 4 (H): while the user is actively scrolling, fade the floating
     buttons out so they never cover content mid-scroll; ~1s after
     scrolling stops they fade back in. Never touches the chat button's

  var scrollFabTimer = null;

  window.addEventListener("scroll", function(){
    document.body.classList.add("scrolling");

    if (scrollFabTimer) clearTimeout(scrollFabTimer);
    scrollFabTimer = setTimeout(function(){ document.body.classList.remove("scrolling"); }, 1000);
  }, { passive: true });
  /* Round 5 (O): the class must never stick. scrollend drops it the moment
     scrolling truly ends, and a watchdog drops it if no scroll event
     arrived for 1.2s (stray events from image loads / URL-bar shifts). */
  window.addEventListener("scrollend", function(){

  // In-site MP3 download: fetch the audio (CORS allows it from both
  // Cloudinary and tempfile) and save it as "<song title>.mp3" — the
  // browser tab never opens. Falls back to opening the URL on failure.
  function safeFileName(title){
    var s = String(title || t("untitled")).trim().replace(/[\\/:*?"<>|]/g, "").replace(/\s+/g, " ").trim();
    if (!s) s = t("untitled");
    return s.slice(0, 120) + ".mp3";
  }
  function downloadSong(song, btn){
    var url = playUrl(songUrl(song));
    if (!url) return;
    if (btn && btn.getAttribute("data-busy") === "1") return;
    if (btn) btn.setAttribute("data-busy", "1");
    noteEl.textContent = t("downloadingFile");
    fetch(url, { mode: "cors" }).then(function(r){
      if (!r.ok) throw new Error("http " + r.status);
      return r.blob();
    }).then(function(blob){
      var objUrl = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = objUrl;
      a.download = safeFileName(song.title);
      document.body.appendChild(a);
      a.click();
      setTimeout(function(){ try { URL.revokeObjectURL(objUrl); } catch (e) {} try { a.remove(); } catch (e) {} }, 5000);
      noteEl.textContent = "";
      if (btn) btn.setAttribute("data-busy", "");
    }).catch(function(){
      noteEl.textContent = t("downloadFailed");
      if (btn) btn.setAttribute("data-busy", "");
      try { window.open(url, "_blank"); } catch (e) {}

    // Local tombstone only — there is no server endpoint to delete a

    var ids = [];

        try { au.load(); } catch (e) {}
      } else if (au.error && cur >= 0 && cur < songs.length) {
        playWithUrls(songPlayUrls(songs[cur]));
        syncPlayBtn();
        return;
      }
      var srcNow = au.src;
      au.play().then(function(){ clearPlayErr(); syncPlayBtn(); }).catch(function(err){ onPlayFailed(err, srcNow); });
    } else { au.pause(); }
    syncPlayBtn();
  });
  pNext.addEventListener("click", playNext);
  pClose.addEventListener("click", function(){
    snapRestoring = false;
    au.pause(); au.removeAttribute("src"); au.load();
    cur = -1; playerEl.hidden = true; document.body.classList.remove("player-on"); markPlaying(); clearPlayErr();
  });
  au.addEventListener("play", syncPlayBtn);
  au.addEventListener("pause", syncPlayBtn);
  au.addEventListener("playing", function(){ clearPlayErr(); });
  au.addEventListener("error", function(){ onPlayFailed(au.error); syncPlayBtn(); });
  au.addEventListener("ended", playEnded);
  /* ---- Player seek bar + time (stage 14) ---- */
  var pSeek = document.getElementById("pSeek");
  var pCur = document.getElementById("pCur");
  var pDur = document.getElementById("pDur");
  var seekDrag = false;
  function fmtPlayerTime(s){
    s = Math.max(0, Math.floor(s || 0));
    return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  }
  au.addEventListener("loadedmetadata", function(){
    if (pDur) pDur.textContent = fmtPlayerTime(au.duration);
    if (pSeek) pSeek.value = "0";
    if (pCur) pCur.textContent = "0:00";
  });
  au.addEventListener("timeupdate", function(){
    if (seekDrag || !au.duration || !isFinite(au.duration)) return;
    if (pSeek) pSeek.value = String(au.currentTime / au.duration * 100);
    if (pCur) pCur.textContent = fmtPlayerTime(au.currentTime);
  });
  if (pSeek) {
    pSeek.addEventListener("pointerdown", function(){ seekDrag = true; });
    pSeek.addEventListener("pointerup", function(){ seekDrag = false; });
    pSeek.addEventListener("input", function(){
      if (!au.duration || !isFinite(au.duration)) return;
      au.currentTime = Number(pSeek.value || 0) / 100 * au.duration;
      if (pCur) pCur.textContent = fmtPlayerTime(au.currentTime);
    });
  }

  applyLang();
  // Resume any generation handed off by Create (or left by a refresh):
  // the creating rows come back and polling continues where it stopped.
  email = getEmail();
  if (email) {
    pendingJobs = loadPendingGens(email);
    pendingJobs.forEach(function(job){
      if (!job.slots || job.slots.length !== 2) job.slots = [{}, {}];
      job.state = "creating";
    });
    renderCreating();
    pendingJobs.forEach(function(job){ pollJob(job); });
  }

  /* ---- Round 4 (J): return-to-app snapshot (My Songs list + player) ---- */
  var SNAP_KEY = "movai-snap-songs";
  /* ---- Round 4 (J): return-to-app snapshot, 4-minute grace ----
     A weak phone's Chrome discards the background tab and reloads it on
     return. This site never reloads itself on return - instead it saves
     a small snapshot (scroll + rendered list + player state) when the
     page hides and every 10s, and restores it instantly when the return
     is within GRACE_MS. Older than that: normal fresh load. */
  var GRACE_MS = 4 * 60 * 1000;
  function snapLoad(){
    try {
      var raw = localStorage.getItem(SNAP_KEY);
      if (!raw) return null;
      var s = JSON.parse(raw);
      if (!s || typeof s.savedAt !== "number") return null;
      if (Date.now() - s.savedAt > GRACE_MS) return null;
      return s;
    } catch (e) { return null; }
  }
  document.addEventListener("visibilitychange", function(){ if (document.visibilityState === "hidden") snapSave(); });
  window.addEventListener("pagehide", snapSave);
  window.addEventListener("beforeunload", snapSave);
  setInterval(function(){ if (!document.hidden) snapSave(); }, 10000);
  function snapSave(){
    try {
      var p = null;
      if (cur >= 0 && songs[cur]) {
        p = { songId: String(songs[cur].id || songs[cur].audioId || ""), currentTime: au.currentTime || 0, wasPlaying: !au.paused && !playerEl.hidden };
      }
      localStorage.setItem(SNAP_KEY, JSON.stringify({ savedAt: Date.now(), scrollY: window.scrollY || 0, items: songs.slice(0, 100), player: p }));
    } catch (e) {}
  }
  function snapRestorePlayer(p){
    if (!p || typeof p.songId !== "string") return;
    var idx = -1;
    for (var i = 0; i < songs.length; i++) { if (String(songs[i].id || songs[i].audioId || "") === p.songId) { idx = i; break; } }
    if (idx < 0) return;
    cur = idx;
    var song = songs[idx];
    clearPlayErr();
    pCover.src = songCover(song) || COVER_FALLBACK;
    pCover.onerror = function(){ if (pCover.src !== COVER_FALLBACK) pCover.src = COVER_FALLBACK; };
    pTitle.textContent = song.title || t("untitled");
    playerEl.hidden = false; document.body.classList.add("player-on");
    markPlaying();
    syncModeBtns(); /* Round 4 (L): modes come back from localStorage */
    playUrls = songPlayUrls(song); playUrlIdx = 0; playTriedSrc = "";
    if (!playUrls.length) return;
    snapRestoring = true;
    au.src = playUrls[0];
    var wantTime = (typeof p.currentTime === "number" && p.currentTime > 0) ? p.currentTime : 0;
    var seeked = false;
    function doSeek(){
      if (seeked) return; seeked = true; snapRestoring = false;
      try { if (wantTime > 0 && isFinite(au.duration) && wantTime < au.duration) au.currentTime = wantTime; } catch (e) {}
      /* Resume only if it was playing; if the browser blocks autoplay the
         rejection is swallowed silently - never an error for that. */
      if (p.wasPlaying) { try { var pr = au.play(); if (pr && pr.catch) pr.catch(function(){}); } catch (e) {} }
    }
    au.addEventListener("loadedmetadata", doSeek, { once: true });
    try { au.load(); } catch (e) {}
    setTimeout(function(){ if (!seeked) { seeked = true; snapRestoring = false; } }, 10000);
  }
  function snapRestore(){
    var s = snapLoad();
    if (!s || !Array.isArray(s.items) || !s.items.length) return false;
    songs = s.items.slice(0, 100);
    renderList();
    if (s.player) snapRestorePlayer(s.player);
    if (typeof s.scrollY === "number" && s.scrollY > 0) {
      requestAnimationFrame(function(){ try { window.scrollTo(0, s.scrollY); } catch (e) {} });
    }
    return true;
  }

  if (!snapRestore()) loadSongs();
  checkSharedSong();
})();
</script>
<script>
(function(){
  "use strict";
  /* ---- Chat button: slides in from the right edge on app open (blurry to
     clear); if untouched for 10s it fades back to blurry, slides out to the
     right and disappears completely; it returns on the next app open. ---- */
  var fab = document.getElementById("chatFab");
  if (!fab) return;
  var HIDE_MS = 10000;
  var hideTimer = null;
  function openChat(){
    if (window.location.pathname && window.location.pathname.indexOf("movai-new-chat.html") !== -1) {
      var inp = document.getElementById("chatInput");
      if (inp) { inp.focus(); }
      window.scrollTo(0, document.body.scrollHeight);
      return;
    }
    window.location.href = "movai-new-chat.html";
  }
  function hideFab(){
    fab.classList.remove("in");
    fab.classList.add("out");
    setTimeout(function(){ fab.style.display = "none"; }, 500);
  }
  function cancelHide(){ if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; } }
  fab.addEventListener("pointerdown", cancelHide);
  fab.addEventListener("mouseenter", cancelHide);
  fab.addEventListener("touchstart", cancelHide, { passive: true });
  fab.addEventListener("focus", cancelHide);
  fab.addEventListener("click", function(e){ e.preventDefault(); cancelHide(); openChat(); });
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      fab.classList.add("in");
      hideTimer = setTimeout(hideFab, HIDE_MS);
    });
  });
})();
</script>
